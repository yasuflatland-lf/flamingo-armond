name: backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Go from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          working_directory: backend

      - name: Generate gqlgen artifacts
        run: go tool gqlgen generate

      - name: Generate goyacc artifacts
        run: go tool goyacc -v /dev/null -o internal/textdic/parser.go -p yy internal/textdic/grammar.y

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

  test:
    name: Build & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Go from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          working_directory: backend

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Generate gqlgen artifacts
        run: |
          go tool gqlgen generate
          git diff --exit-code -- graph/resolver/*.resolvers.go

      - name: Verify goyacc artifacts
        run: |
          go tool goyacc -v /dev/null -o internal/textdic/parser.go -p yy internal/textdic/grammar.y
          git diff --exit-code -- internal/textdic/parser.go

      - name: Verify no fmt.Errorf("%w") remains
        run: |
          if grep -rnE 'fmt\.Errorf\([^)]*%w' internal cmd | grep -v _test.go; then
            echo "::error::fmt.Errorf with %w found; use eris.Wrap instead (see docs/backend.md)" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate HTML coverage
        # goyacc emits `//line yaccpar:1` / `//line yacctab:1` directives in
        # internal/textdic/parser.go, so coverage.out references virtual paths
        # `internal/textdic/yaccpar` / `yacctab` that have no on-disk file.
        # `go tool cover -html` opens every path it sees and fails on those.
        # Strip those rows for HTML rendering only; the original coverage.out
        # is left intact for Codecov, which honours the line directives.
        run: |
          grep -vE '/(yaccpar|yacctab):' coverage.out > coverage.html.out
          go tool cover -html=coverage.html.out -o coverage.html
          rm coverage.html.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14

      - name: Upload coverage to Codecov
        id: codecov
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend
          fail_ci_if_error: true

      - name: Warn on Codecov upload failure
        if: steps.codecov.outcome == 'failure'
        run: echo "::warning::Codecov upload failed — coverage trend may not be updated"

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not configured" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered."
