name: backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'schema/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'schema/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise (Go from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          working_directory: backend

      # mise-action only caches the Go toolchain install, not the build or
      # module cache. Without this, every run recompiles all dependencies and
      # the standard library from scratch — the dominant cost behind gqlgen
      # generate, go-arch-lint, build, and `go test`.
      - name: Resolve Go cache paths
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Generate gqlgen artifacts
        run: |
          go tool gqlgen generate
          git diff --exit-code -- graph/resolver/*.resolvers.go

      - name: Verify goyacc artifacts
        run: |
          go tool goyacc -v /dev/null -o internal/textdic/parser.go -p yy internal/textdic/grammar.y
          git diff --exit-code -- internal/textdic/parser.go

      - name: Verify no fmt.Errorf("%w") remains
        run: |
          if grep -rnE 'fmt\.Errorf\([^)]*%w' internal cmd | grep -v _test.go; then
            echo "::error::fmt.Errorf with %w found; use eris.Wrap instead (see docs/backend.md)" >&2
            exit 1
          fi

      - name: Forbid &ucerr.ValidationError / &ucerr.ForbiddenError struct literals outside ucerr and tests
        working-directory: backend
        run: |
          if grep -rnE '&ucerr\.(ValidationError|ForbiddenError)\{' \
              internal graph --include='*.go' --exclude='*_test.go' \
              | grep -v 'internal/usecase/ucerr/errors\.go'; then
            echo "::error::Use ucerr.NewValidationError / ucerr.NewForbiddenError instead of struct literals. See .claude/rules/error-wrapping.md."
            exit 1
          fi

      - name: Forbid resolver returning raw usecase error
        working-directory: backend
        run: |
          miss=$(awk '
            /:= r\.[A-Z][a-zA-Z0-9_]*(UC|Usecase)\./ { window = NR + 5; in_window = 1; next }
            in_window && NR <= window {
              if (/return .*, err($|[^a-zA-Z])/ && !/FromUsecaseError/) {
                print FILENAME ":" NR ": " $0
                in_window = 0
              }
            }
            in_window && NR > window { in_window = 0 }
          ' graph/resolver/*.resolvers.go)
          if [ -n "$miss" ]; then
            echo "::error::Resolver passes through a usecase error without FromUsecaseError wrap. Wrap every usecase call site with gqlerr.FromUsecaseError(ctx, err). See .claude/rules/error-wrapping.md."
            echo "$miss"
            exit 1
          fi

      - name: Verify no hardcoded extensions.code literals outside gqlerr
        run: |
          if grep -rnE '"code"\s*:\s*"(UNAUTHENTICATED|BAD_USER_INPUT|FORBIDDEN|INTERNAL|CANCELLED)"' internal cmd graph --include='*.go' \
              | grep -v 'internal/gqlerr/' \
              | grep -v '_test.go'; then
            echo "::error::Hardcoded extensions.code literal found outside gqlerr package. Use gqlerr.* helpers or gqlerr.FromUsecaseError instead."
            exit 1
          fi

      - name: Schema-lint outcome-union enforcement
        working-directory: backend
        run: |
          rc=0
          go run ./cmd/schema-lint || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Schema-lint failed with exit $rc. See docs/backend/error-wrapping/outcome-union-enforcement.md for the promotion guide (exit 1 = violation/drift; exit 2 = walker/config error)."
            exit "$rc"
          fi

      - name: Enforce layer dependencies (go-arch-lint)
        run: |
          go tool go-arch-lint check --project-path .

      - name: Build
        run: go build ./...

      # Reachability-based vulnerability scan. govulncheck's call-graph
      # analysis only reports vulns actually reachable from our code, so a
      # non-zero exit is actionable and gates the merge. Runs after the gqlgen
      # generate step so graph/generated (gitignored) exists on disk; scanning
      # earlier would fail to load those packages.
      - name: Scan for known vulnerabilities (govulncheck)
        run: go tool govulncheck ./...

      - name: Test with coverage
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate HTML coverage
        # goyacc emits `//line yaccpar:1` / `//line yacctab:1` directives in
        # internal/textdic/parser.go, so coverage.out references virtual paths
        # `internal/textdic/yaccpar` / `yacctab` that have no on-disk file.
        # `go tool cover -html` opens every path it sees and fails on those.
        # Strip those rows for HTML rendering only; the original coverage.out
        # is left intact for Codecov, which honours the line directives.
        run: |
          grep -vE '/(yaccpar|yacctab):' coverage.out > coverage.html.out
          go tool cover -html=coverage.html.out -o coverage.html
          rm coverage.html.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14

      - name: Upload coverage to Codecov
        id: codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend
          fail_ci_if_error: true

      - name: Warn on Codecov upload failure
        if: steps.codecov.outcome == 'failure'
        run: echo "::warning::Codecov upload failed — coverage trend may not be updated"

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not configured" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered."
