name: frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.tool-versions'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.tool-versions'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    env:
      # Required by `frontend/src/env.ts` (@t3-oss/env-nextjs) at build time.
      # CI does not reach the backend; the value is a placeholder that only
      # needs to satisfy `z.string().url()`.
      BACKEND_URL: http://localhost:1323
      # Supabase client env vars — dummy values satisfy Zod validation at
      # build/test time without a running Supabase instance.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-dummy-key-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Node + pnpm from .tool-versions)
        uses: jdx/mise-action@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (graphql-codegen)
        run: pnpm --filter frontend codegen

      - name: Biome check
        run: pnpm --filter frontend lint

      - name: TypeScript typecheck
        run: pnpm --filter frontend typecheck

      - name: Build
        run: pnpm --filter frontend build

      - name: Vitest with coverage
        run: pnpm --filter frontend --if-present test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        id: codecov
        # Run from the repo root (no `working-directory`) so the CLI's network
        # discovery prepends `frontend/` to the `SF:src/...` entries emitted by
        # vitest. With it set, uploaded paths stay `src/...` and the
        # `flags.frontend.paths: frontend/` filter in codecov.yml drops every
        # file, leaving the flag at 0% (badge renders as "unknown").
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Warn on Codecov upload failure
        if: steps.codecov.outcome == 'failure'
        run: echo "::warning::Codecov upload failed — coverage trend may not be updated"
