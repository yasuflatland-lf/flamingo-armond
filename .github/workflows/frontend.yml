name: frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.tool-versions'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.tool-versions'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    env:
      # Required by `frontend/src/env.ts` (@t3-oss/env-nextjs) at build time.
      # CI does not reach the backend; the value is a placeholder that only
      # needs to satisfy `z.string().url()`.
      BACKEND_URL: http://localhost:1323
      # Supabase client env vars — dummy values satisfy Zod validation at
      # build/test time without a running Supabase instance.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-dummy-key-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Node + pnpm from .tool-versions)
        uses: jdx/mise-action@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (graphql-codegen)
        run: pnpm --filter frontend codegen

      - name: Biome check
        run: pnpm --filter frontend lint

      - name: TypeScript typecheck
        run: pnpm --filter frontend typecheck

      - name: Build
        run: pnpm --filter frontend build

      - name: Vitest
        run: pnpm --filter frontend --if-present test

  deploy:
    name: Deploy to Vercel
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: frontend-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Node from .tool-versions)
        uses: jdx/mise-action@v4

      - name: Verify Vercel secrets are set
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Error: VERCEL_TOKEN secret is not configured" >&2
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "Error: VERCEL_ORG_ID secret is not configured" >&2
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Error: VERCEL_PROJECT_ID secret is not configured" >&2
            exit 1
          fi

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@52

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        run: vercel deploy --prebuilt --prod
