name: frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'schema/**'
      - 'eslint.config.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'mise.toml'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'schema/**'
      - 'eslint.config.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'mise.toml'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-26.04
    env:
      # Required by `frontend/src/env.ts` (@t3-oss/env-nextjs) at build time.
      # CI does not reach the backend; the value is a placeholder that only
      # needs to satisfy `z.string().url()`.
      BACKEND_URL: http://localhost:1323
      # Supabase client env vars — dummy values satisfy Zod validation at
      # build/test time without a running Supabase instance.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-dummy-key-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise (Node + pnpm from mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen (graphql-codegen)
        run: pnpm --filter frontend codegen

      # `next-env.d.ts` and `.next/types/routes.d.ts` are gitignored
      # (Next.js 16 toggles paths between dev/build — see
      # docs/dev-setup.md §"Policy on generated files"). `next typegen`
      # regenerates both faster than a full `next build` so the typecheck
      # step below sees a valid type tree.
      - name: Codegen (Next.js typegen)
        run: pnpm --filter frontend exec next typegen

      - name: Guard against re-tracking next-env.d.ts
        run: |
          if git ls-files --error-unmatch frontend/next-env.d.ts >/dev/null 2>&1; then
            echo "::error::frontend/next-env.d.ts is tracked but must remain gitignored."
            echo "Next.js 16 toggles its import path between 'next dev' and 'next build' — committing it produces a churn loop."
            echo "Fix: git rm --cached frontend/next-env.d.ts (the file regenerates on every Next.js invocation)."
            exit 1
          fi

      - name: Lint schema (graphql-eslint)
        run: pnpm lint:schema

      - name: Biome check
        run: pnpm --filter frontend lint

      - name: Knip (unused files / exports / dependencies)
        run: pnpm --filter frontend knip

      - name: TypeScript typecheck
        run: pnpm --filter frontend typecheck

      # Next.js writes its build cache to `frontend/.next/cache`; restoring it
      # lets `next build` skip recompiling unchanged routes. Keyed on lockfile +
      # source hash for correct invalidation, with restore-keys fallbacks for
      # partial reuse when only sources change. `.next/` is already gitignored.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        run: pnpm --filter frontend build

      - name: Vitest with coverage
        run: pnpm --filter frontend --if-present test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        id: codecov
        # Run from the repo root (no `working-directory`) so the CLI's network
        # discovery prepends `frontend/` to the `SF:src/...` entries emitted by
        # vitest. With it set, uploaded paths stay `src/...` and the
        # `flags.frontend.paths: frontend/` filter in codecov.yml drops every
        # file, leaving the flag at 0% (badge renders as "unknown").
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Warn on Codecov upload failure
        if: steps.codecov.outcome == 'failure'
        run: echo "::warning::Codecov upload failed — coverage trend may not be updated"
