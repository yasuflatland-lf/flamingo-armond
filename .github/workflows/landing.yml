name: landing

# Builds the marketing landing page (site/) with Vite and publishes the built
# output (site/dist/) to the root of the gh-pages branch. The ER chart workflow
# (er-chart.yml) publishes to gh-pages/er-chart, so both coexist on the same
# Pages site:
#   https://yasuflatland-lf.github.io/flamingo-armond/           <- landing (this workflow)
#   https://yasuflatland-lf.github.io/flamingo-armond/er-chart/  <- ER chart
# site/public/ carries the gh-pages root extras Vite copies verbatim into the
# build: site/public/vercel.json (ignoreCommand "exit 0", which tells Vercel to
# skip building the gh-pages branch) and site/public/.nojekyll. clean-exclude
# below preserves er-chart/ (owned by er-chart.yml, not by this workflow) when
# this workflow cleans the gh-pages root.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # github-pages-deploy-action needs push access to the gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Node version mirrors the repo-root .tool-versions; pnpm is provisioned by
      # corepack from site/package.json's "packageManager" field. This avoids the
      # full mise toolchain (Rust/mprocs) that the landing build does not need.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Verify the built site has an index and externalized assets
        run: |
          set -euo pipefail
          test -f site/dist/index.html || { echo "::error::site/dist/index.html missing - the build did not emit an entry." >&2; exit 1; }
          # The landing page must reference videos by path, never re-embed base64
          # blobs (which would balloon the bundle and wreck LCP).
          if grep -rq 'data:video/mp4;base64' site/dist; then
            echo "::error::built site embeds a base64 video - externalize it under site/public/videos/." >&2
            exit 1
          fi
          for v in site/dist/videos/learn-demo.mp4 site/dist/videos/cardgroup-demo.mp4; do
            test -f "$v" || { echo "::error::missing $v" >&2; exit 1; }
          done
          # .nojekyll disables Jekyll processing for the whole Pages root; it
          # rides along from site/public/ so the build keeps publishing it.
          test -f site/dist/.nojekyll || { echo "::error::site/dist/.nojekyll missing - keep it under site/public/." >&2; exit 1; }

      - name: Publish site/dist to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/dist
          clean: true
          clean-exclude: |
            er-chart
