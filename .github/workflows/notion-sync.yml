name: notion-sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Notion sync (Render backend)
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NOTION_SYNC_TOKEN }}" \
            -w "notion-sync status=%{http_code} time=%{time_total}s\n" \
            "${{ secrets.NOTION_SYNC_URL }}"
