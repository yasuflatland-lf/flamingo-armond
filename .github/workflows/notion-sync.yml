name: notion-sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight (verify Notion sync secrets)
        id: preflight
        env:
          URL:   ${{ secrets.NOTION_SYNC_URL }}
          TOKEN: ${{ secrets.NOTION_SYNC_TOKEN }}
        run: |
          missing=()
          [ -z "$URL" ]   && missing+=("NOTION_SYNC_URL")
          [ -z "$TOKEN" ] && missing+=("NOTION_SYNC_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Notion sync skipped; missing secrets: ${missing[*]}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Notion sync (Render backend)
        if: steps.preflight.outputs.skip != 'true'
        env:
          URL:   ${{ secrets.NOTION_SYNC_URL }}
          TOKEN: ${{ secrets.NOTION_SYNC_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -w "notion-sync status=%{http_code} time=%{time_total}s\n" \
            "$URL"
