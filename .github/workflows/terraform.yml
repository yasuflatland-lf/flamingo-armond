name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - 'ops/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/terraform/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-check:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Terraform from ops/terraform/mise.toml)
        uses: jdx/mise-action@v4
        with:
          working_directory: ops/terraform

      - name: Check HCL formatting
        working-directory: ops/terraform
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.path }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Env stacks only. Modules under ops/terraform/modules/** are
        # validated transitively via the env stacks that consume them, so
        # listing them here would duplicate coverage. The settings stack uses
        # `data.terraform_remote_state` to read `../initial/terraform.tfstate`,
        # but `terraform validate` does not evaluate data sources, so the
        # missing state file in CI does not break validation.
        path:
          - ops/terraform/envs/prod/initial
          - ops/terraform/envs/prod/settings

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up mise (Terraform from ops/terraform/mise.toml)
        uses: jdx/mise-action@v4
        with:
          working_directory: ops/terraform

      - name: Init (no backend)
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false

      - name: Validate HCL
        working-directory: ${{ matrix.path }}
        run: terraform validate

  # Fan-in job for branch protection: requiring this single check guarantees
  # all matrix legs above have passed. Configuring branch protection on the
  # individual `Validate <path>` legs would silently leave new matrix entries
  # unprotected.
  validate-all:
    name: All Terraform validations passed
    needs: [fmt-check, validate]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "fmt-check and all validate matrix legs passed"
