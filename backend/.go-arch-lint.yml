version: 3
workdir: .
allow:
  depOnAnyVendor: true        # vendor surface is not the invariant we enforce
  deepScan: true              # v3 default; explicit for clarity
  ignoreNotFoundComponents: false

excludeFiles:
  - '^.*_test\.go$'            # tests legitimately cross layers
  - '.*schema-lint/testdata/.*\.go$'  # sample Go files for schema-lint's own AST-walker tests; not part of the binary
  # graph/generated and graph/model are gqlgen output — declared as
  # commonComponents below, not excluded, so they participate in the graph.
  # internal/textdic/parser.go is goyacc output but lives inside `textdic`
  # which has no internal deps anyway; no exclude needed.

components:
  auth:                { in: internal/auth }
  cefr:                { in: internal/cefr }
  cursor:              { in: internal/cursor }
  database:            { in: internal/database }
  database_testsupport: { in: internal/database/testsupport }
  domain:              { in: internal/domain }
  domain_service:      { in: internal/domain/service }
  gqlerr:              { in: internal/gqlerr }
  gqlerrtest:          { in: internal/gqlerr/gqlerrtest }
  handler_notionsync:  { in: internal/handler/notionsync }
  handler_ping:        { in: internal/handler/ping }
  loader:              { in: internal/loader }
  logging:             { in: internal/logging }
  middleware:          { in: internal/middleware }
  notion:              { in: internal/notion }
  repository:          { in: internal/repository }
  telemetry:           { in: internal/telemetry }
  textdic:             { in: internal/textdic }
  ucerr:               { in: internal/usecase/ucerr }
  usecase:             { in: internal/usecase }
  resolver:            { in: graph/resolver }
  graph_generated:     { in: graph/generated }
  graph_model:         { in: graph/model }
  cmd_server:          { in: cmd/server }
  cmd_seed:            { in: cmd/seed }
  cmd_schema_lint:     { in: cmd/schema-lint }
  cmd_migrate_to_master: { in: cmd/migrate-to-master }

commonComponents:
  - graph_generated
  - graph_model

deps:
  auth:               { mayDependOn: [domain, logging, repository] }
  cefr:               { mayDependOn: [domain] }
  cursor:             { anyVendorDeps: true }           # leaf: vendor-only deps (eris, std)
  database:           { anyVendorDeps: true }           # leaf: vendor-only deps (gorm, pgx, migrate, eris)
  database_testsupport: { anyVendorDeps: true }         # leaf: test-only helper, vendor-only deps (pgx, eris)
  domain:             { anyVendorDeps: true }           # leaf: vendor-only deps (uuid, uniseg, eris)
  domain_service:     { mayDependOn: [domain] }
  gqlerr:             { mayDependOn: [logging, ucerr] }
  # Test-only assertion helpers. Only _test.go files import this component, and
  # those are excluded above, so no other component declares it as a dependency.
  gqlerrtest:         { mayDependOn: [gqlerr] }
  handler_notionsync: { mayDependOn: [logging, notion, usecase] }
  handler_ping:       { mayDependOn: [repository] }
  loader:             { mayDependOn: [auth, domain, repository] }
  logging:            { anyVendorDeps: true }           # leaf: vendor-only deps (eris, slog)
  middleware:         { anyVendorDeps: true }           # leaf: vendor-only deps (echo, uuid)
  notion:             { mayDependOn: [domain] }
  repository:         { mayDependOn: [domain] }
  telemetry:          { anyVendorDeps: true }           # leaf: vendor-only deps (otel, eris)
  textdic:            { anyVendorDeps: true }           # leaf: vendor-only deps (eris)
  ucerr:              { anyVendorDeps: true }           # leaf: go-arch-lint requires at least one allow setting; ucerr imports stdlib only
  usecase:
    mayDependOn:
      - auth
      - cursor
      - domain
      - domain_service
      - logging
      - notion
      - repository
      - textdic
      - ucerr
    # NOTE: `gqlerr` is deliberately absent — this is the #154 invariant.
  resolver:
    mayDependOn:
      - auth
      - cursor
      - domain
      - domain_service
      - gqlerr
      - loader
      - textdic
      - usecase
  cmd_server:
    anyProjectDeps: true        # composition root
  cmd_seed:
    anyVendorDeps: true          # CLI must not pull in project/transport deps; vendor ok
  cmd_schema_lint:
    anyVendorDeps: true          # CLI must not pull in project/transport deps; vendor ok
  cmd_migrate_to_master:
    anyVendorDeps: true          # CLI must not pull in project/transport deps; vendor ok
