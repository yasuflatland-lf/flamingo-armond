version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        # Cleanup-only calls whose errors are non-actionable.
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/golang-migrate/migrate/v4.Migrate).Close
        - (github.com/golang-migrate/migrate/v4/source.Driver).Close

  exclusions:
    paths:
      - graph/generated
      - graph/model/models_gen\.go
      - internal/textdic/parser\.go
    rules:
      # gqlerr.Internal is invoked for its slog side-effect in tests; the
      # *gqlerror.Error return value is intentionally discarded.
      - path: internal/gqlerr/.*_test\.go
        linters: [errcheck]
        text: "gqlerr.Internal"
      # Best-effort backtrack: UnreadRune fails only when no rune was read.
      - path: internal/textdic/lexer\.go
        linters: [errcheck]
        text: "UnreadRune"
      # Intentional: verifies that wrong context-key type does not collide.
      - path: internal/auth/user_test\.go
        linters: [staticcheck]
        text: "SA1029"
