# Paths are relative to this file (backend/gqlgen.yml).

schema:
  - ../schema/*.graphql

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph/resolver
  package: resolver
  filename_template: "{name}.resolvers.go"
  omit_template_comment: false

# Prefer our own model package when names collide.
autobind:
  - backend/graph/model

models:
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Cardgroup:
    fields:
      owner:
        resolver: true
  Card:
    fields:
      cardgroup:
        resolver: true
  User:
    fields:
      roles:
        resolver: true
      lastViewedCardgroup:
        resolver: true
