coverage:
  range: "50...70"
  status:
    project:
      backend:
        target: 70%
        threshold: 1%
        flags: [backend]
      frontend:
        target: 70%
        threshold: 1%
        flags: [frontend]
    patch:
      backend:
        target: 70%
        flags: [backend]
      frontend:
        target: 70%
        flags: [frontend]

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  # Test-support helpers (testcontainers DB bootstrap) are exercised by the
  # consuming packages' tests, but `go test ./...` only credits coverage to the
  # package that owns the test, so the helper shows 0% and skews patch coverage.
  - "backend/internal/database/testsupport"
