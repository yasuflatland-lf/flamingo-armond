<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF6F79">
  <title>Offline · flamingo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      max-width: 360px;
      text-align: center;
    }

    img {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 32px;
      border-radius: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      color: #666666;
      margin-bottom: 32px;
    }

    a {
      display: inline-block;
      background: #FF6F79;
      color: #ffffff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: background-color 150ms ease, box-shadow 150ms ease;
      border: 2px solid transparent;
      outline-offset: 2px;
    }

    a:hover {
      background-color: #ff5a63;
    }

    a:active {
      background-color: #e85a5f;
    }

    a:focus-visible {
      outline: 2px solid #FF6F79;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="./icon-192.png" alt="flamingo" width="24" height="24">
    <h1>You're offline</h1>
    <p>We can't reach the network right now. Check your connection and try again.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
