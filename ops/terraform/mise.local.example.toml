# Template for envs/<name>/mise.local.toml. Copy into the target env directory,
# then fill in values from the manual prerequisites listed in
# docs/deployment.md § "Manual prerequisites for terraform apply".
#
#   cp ops/terraform/mise.local.example.toml ops/terraform/envs/prod/mise.local.toml
#
# The real file MUST stay gitignored (see ops/terraform/.gitignore).

[env]
# --- Supabase ---------------------------------------------------------------
# https://supabase.com/dashboard/account/tokens
TF_VAR_supabase_access_token    = "sbp_REPLACE_ME"
# `curl -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/organizations`
TF_VAR_supabase_organization_id = "REPLACE_ME"

# --- Render -----------------------------------------------------------------
# https://dashboard.render.com/u/settings#api-keys
TF_VAR_render_api_key  = "rnd_REPLACE_ME"
# `curl -H "Authorization: Bearer $RENDER_KEY" https://api.render.com/v1/owners`
TF_VAR_render_owner_id = "REPLACE_ME"
# Plan tier per env. Free is fine for prod-of-one until traffic warrants it.
TF_VAR_render_plan     = "free"

# --- Vercel -----------------------------------------------------------------
# https://vercel.com/account/tokens
TF_VAR_vercel_api_token = "REPLACE_ME"
# Empty string when deploying to a personal account.
TF_VAR_vercel_team_id   = ""

# --- Google OAuth -----------------------------------------------------------
# https://console.cloud.google.com/apis/credentials
# Authorized redirect URI must include
#   https://<supabase-project-ref>.supabase.co/auth/v1/callback
# The project ref is only known after the first apply, so create the OAuth
# client first with a placeholder, then update its redirect URI once the
# Supabase project exists. See docs/deployment.md.
TF_VAR_google_oauth_client_id     = "REPLACE_ME.apps.googleusercontent.com"
TF_VAR_google_oauth_client_secret = "GOCSPX-REPLACE_ME"
