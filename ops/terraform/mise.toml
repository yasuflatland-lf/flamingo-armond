# Shared tool versions and non-secret env vars for all environments.
# Per-env overrides live in envs/<name>/mise.local.toml (gitignored).
# Hierarchical loading means `cd envs/prod` inherits this file plus the
# env-local overrides automatically.

[tools]
terraform = "1.14.9"
tflint    = "0.62.0"

[env]
TF_VAR_project_name    = "flamingo-armond"
TF_VAR_github_repo     = "yasuflatland-lf/flamingo-armond"
TF_VAR_supabase_region = "ap-northeast-1"
TF_VAR_render_region   = "singapore"
