; Minimal Ansible configuration for local-only playbook runs.
; Loaded via ANSIBLE_CONFIG exported from the repo-root Makefile. Ansible's
; own search order is ANSIBLE_CONFIG -> ./ansible.cfg -> ~/.ansible.cfg —
; it does not consult the -i inventory directory, so the env var is required.

[defaults]
inventory          = ./inventory.local
retry_files_enabled = false
host_key_checking  = false
interpreter_python = auto_silent

[colors]
; "FAILED - RETRYING" is emitted with COLOR_DEBUG (default: dark gray), which
; renders as near-black on dark terminals. Bright cyan stays calm next to the
; "ok"/"changed" hues but is clearly legible during long polls.
debug = bright cyan
