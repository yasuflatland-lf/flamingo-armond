; Minimal Ansible configuration for local-only playbook runs.
; Picked up automatically when ansible-playbook is invoked with -i pointing
; into this directory (the Makefile passes -i playbooks/inventory.local).

[defaults]
inventory          = ./inventory.local
retry_files_enabled = false
host_key_checking  = false
interpreter_python = auto_silent

[colors]
; "FAILED - RETRYING" is emitted with COLOR_DEBUG (default: dark gray), which
; renders as near-black on dark terminals. Override to bright gray for legibility.
debug = bright gray
