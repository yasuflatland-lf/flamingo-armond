---
# Phase 6: postapply -- fully automated final phase.
#
# Reads:  state file (render_service_id, backend_url, production_url,
#                     vercel_project_id, vercel_repo_id).
# Writes: nothing (state is read-only here).
#
# Flow:
#   1. Load state and verify the keys this phase depends on.
#   2. Pull RENDER_API_KEY and VERCEL_API_TOKEN from the environment.
#   3. POST a deploy to Vercel (gitSource: main) so it rebuilds with the env
#      vars Phase 4 registered. We don't poll Vercel: the build (~1-2 min) runs
#      in parallel with the Render poll below, finishing well before the
#      front-end HEAD probe.
#   4. POST a deploy to Render and capture the deploy id.
#   5. Poll the Render deploy until it reaches "live" (max 15 min, fast-fail
#      on build_failed / update_failed / canceled / deactivated /
#      pre_deploy_failed).
#   6. Smoke test backend /health, GraphQL /query, and the production URL HEAD.
#   7. Print the three URLs and remind the operator that the /profile E2E
#      check is a manual step (Google sign-in required).
#
# Re-run safety: this phase has no state writes, so re-running is harmless --
# every invocation triggers a fresh Vercel + Render deploy.

# Postapply cannot run before Phases 3 + 4 have written state, so a
# missing file is itself a misuse. Stat first so a missing file vs.
# corrupt YAML produce distinct errors (the latter would otherwise be
# masked by `failed_when: false`).
- name: Stat state file (postapply requires Phases 2-4 to have run)
  ansible.builtin.stat:
    path: "{{ state_file }}"
  register: _state_stat

- name: Load state file (postapply)
  ansible.builtin.include_vars:
    file: "{{ state_file }}"
  when: _state_stat.stat.exists

- name: Assert state has the keys postapply needs
  ansible.builtin.assert:
    that:
      - _state_stat.stat.exists
      - render_service_id is defined and (render_service_id | length) > 0
      - backend_url is defined and (backend_url | length) > 0
      - production_url is defined and (production_url | length) > 0
      - vercel_project_id is defined and (vercel_project_id | length) > 0
      - vercel_repo_id is defined and (vercel_repo_id | string | length) > 0
    fail_msg: |
      State file is missing or incomplete:
        state file exists : {{ _state_stat.stat.exists }}
        render_service_id : {{ render_service_id | default('(missing)') }}
        backend_url       : {{ backend_url | default('(missing)') }}
        production_url    : {{ production_url | default('(missing)') }}
        vercel_project_id : {{ vercel_project_id | default('(missing)') }}
        vercel_repo_id    : {{ vercel_repo_id | default('(missing)') }}
      Run the prerequisite phases first:
        - render_service_id, backend_url               -> ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags render   (Phase 3)
        - production_url, vercel_project_id, vercel_repo_id -> ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags vercel  (Phase 4)
      If the state file appears corrupt, restore from the most recent backup:
        cp "$(ls -1t {{ state_file }}.*~ 2>/dev/null | head -1)" {{ state_file }}
    success_msg: "State file looks good for postapply."

- name: Read RENDER_API_KEY from the environment
  ansible.builtin.set_fact:
    render_api_key: "{{ lookup('env', 'RENDER_API_KEY') }}"
  no_log: true

- name: Fail fast if RENDER_API_KEY is empty
  ansible.builtin.fail:
    msg: |
      RENDER_API_KEY is not set in the environment.
      Preflight should have caught this -- run `make setup-prod-preflight`
      and confirm `.env` (or your shell) exports a valid Render API key.
  when: (render_api_key | length) == 0

- name: Read VERCEL_API_TOKEN from the environment
  ansible.builtin.set_fact:
    vercel_token: "{{ lookup('env', 'VERCEL_API_TOKEN') }}"
  no_log: true

- name: Fail fast if VERCEL_API_TOKEN is empty
  ansible.builtin.fail:
    msg: |
      VERCEL_API_TOKEN is not set in the environment.
      Preflight should have caught this -- run `make setup-prod-preflight`.
  when: (vercel_token | length) == 0

# ---------------------------------------------------------------------------
# Trigger a Vercel production deploy so it rebuilds with the env vars Phase 4
# registered. We POST and move on -- the Render poll loop below absorbs the
# Vercel build wall-clock time, and the final HEAD probe verifies readiness.
#
# `gitSource` requires a numeric `repoId` (not the "owner/repo" string), which
# Phase 4 captures from /v9/projects/{id}.link.repoId and persists to state.
# ---------------------------------------------------------------------------
- name: Trigger a Vercel production deploy (picks up Phase 4 env)
  block:
    - name: POST /v13/deployments (Vercel)
      ansible.builtin.uri:
        url: "https://api.vercel.com/v13/deployments"
        method: POST
        headers:
          Authorization: "Bearer {{ vercel_token }}"
        body_format: json
        body:
          name: "flamingo-armond-frontend"
          project: "{{ vercel_project_id }}"
          target: production
          gitSource:
            type: github
            ref: main
            repoId: "{{ vercel_repo_id | int }}"
        status_code: [200, 201]
      register: vercel_deploy_kick
      no_log: true
  rescue:
    - name: Surface Vercel deploy-trigger failure
      ansible.builtin.fail:
        msg: |
          Failed to POST a new Vercel deploy.

            HTTP status : {{ vercel_deploy_kick.status | default('(connection error)') }}
            Server msg  : {{ vercel_deploy_kick.json.error.message | default(vercel_deploy_kick.msg | default('(none)')) }}

          Likely causes:
            - 401 / 403 : VERCEL_API_TOKEN is invalid or lacks deploy scope.
                Rotate at: https://vercel.com/account/tokens
            - 400       : repoId / project mismatch -- re-run Phase 4 to
                refresh state, or push at least one commit to `main` so
                Vercel has something to build.
            - 5xx       : Vercel outage; check https://www.vercel-status.com

- name: Capture Vercel deploy id
  ansible.builtin.set_fact:
    vercel_deploy_id: "{{ vercel_deploy_kick.json.id | default('') }}"

- name: Show the Vercel deploy id (operator can cross-check the dashboard)
  ansible.builtin.debug:
    msg: "Vercel deploy kicked: {{ vercel_deploy_id }} (build runs in parallel with Render poll)"

# Wrapped in block/rescue because the inner task carries `no_log: true`
# (the request URL embeds render_service_id and the Bearer header carries
# the API key; both should not echo on -v). Without a rescue, a 4xx/5xx
# or connection error would surface as Ansible's censored "the output has
# been hidden" message with zero context. The rescue references registered
# fields (`deploy_kick.status` etc.) which retain their data even under
# `no_log` -- only display is suppressed for the originating task.
- name: Trigger a Render deploy
  block:
    - name: "POST /v1/services/{{ render_service_id }}/deploys"
      ansible.builtin.uri:
        url: "https://api.render.com/v1/services/{{ render_service_id }}/deploys"
        method: POST
        headers:
          Authorization: "Bearer {{ render_api_key }}"
          Accept: "application/json"
        body_format: json
        body: {}
        status_code: [201]
      register: deploy_kick
      no_log: true
  rescue:
    - name: Surface Render deploy-trigger failure with remediation
      ansible.builtin.fail:
        msg: |
          Failed to POST a new Render deploy.

            HTTP status : {{ deploy_kick.status | default('(connection error)') }}
            Error       : {{ deploy_kick.msg | default('(none)') }}

          Likely causes:
            - 401 / 403 : RENDER_API_KEY is invalid or lacks access.
                Rotate at: https://dashboard.render.com/u/settings#api-keys
            - 404       : render_service_id ({{ render_service_id }}) is wrong.
                Verify in Render dashboard -> service -> Settings -> General.
            - 5xx       : Render outage; check https://status.render.com
            - connection: DNS / network issue; verify reachability.

- name: Capture the new deploy id
  ansible.builtin.set_fact:
    deploy_id: "{{ deploy_kick.json.id }}"

- name: Validate captured deploy id
  ansible.builtin.assert:
    that:
      - deploy_id is defined and (deploy_id | length) > 0
      - deploy_id is match('^dep-[a-zA-Z0-9]+$')
    fail_msg: "Render POST /deploys returned but no usable deploy id was captured (response shape may have changed)."

- name: Show the deploy id (operator can cross-check Render dashboard)
  ansible.builtin.debug:
    msg: "Render deploy kicked: {{ deploy_id }}"

# Poll up to 60 * 15s = 15 minutes. The deploy id and status are not
# sensitive (the id is debug-printed above), so we leave no_log off here --
# the status value is what the operator most needs to see during the wait.
#
# Fast-fail correctness: only the `until` predicate aborts an Ansible
# `until` loop. `failed_when` only sets the final task status after retries
# are exhausted, so terminal conditions (auth errors, terminal Render
# states) MUST be folded into `until` itself; otherwise a bad token burns
# the full 15-minute budget before the rescue fires. Verified empirically.
#
# Wrapped in block/rescue so the bespoke remediation runs in both the
# terminal-condition path (until succeeds, assert below fails on non-live
# final status) and the retry-exhausted path (Ansible itself fails the
# until task).
- name: Wait for Render deploy to reach live status
  block:
    - name: "Poll Render deploy {{ deploy_id }} until live or terminal"
      ansible.builtin.uri:
        url: "https://api.render.com/v1/services/{{ render_service_id }}/deploys/{{ deploy_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ render_api_key }}"
          Accept: "application/json"
        status_code: [200, 401, 403, 404]
      register: deploy_status
      # Abort the loop as soon as we hit any terminal HTTP status (auth /
      # not-found) or any terminal Render deploy state (success or failure).
      # The `(deploy_status.json | default({}))` coerce guards against a 200
      # response with non-JSON body (would otherwise raise undefined-attr).
      until: >-
        (deploy_status.status | default(0)) in [401, 403, 404]
        or ((deploy_status.json | default({})).status | default(''))
           in ['live', 'build_failed', 'update_failed', 'canceled', 'deactivated', 'pre_deploy_failed']
      retries: 60
      delay: 15

    # Surface the actual outcome. If the loop exited via a non-live state
    # this assert fails and the rescue takes over with the bespoke message.
    - name: Verify Render deploy reached live
      ansible.builtin.assert:
        that:
          - (deploy_status.status | default(0)) == 200
          - ((deploy_status.json | default({})).status | default('')) == 'live'
        fail_msg: >-
          Deploy did not reach live (HTTP {{ deploy_status.status | default('(connection error)') }}
          / status {{ (deploy_status.json | default({})).status | default('(unknown)') }}).
  rescue:
    - name: Surface Render poll failure with actionable remediation
      ansible.builtin.fail:
        msg: |
          Render deploy {{ deploy_id }} did not reach 'live'.

            HTTP status   : {{ deploy_status.status | default('(connection error)') }}
            Render status : {{ (deploy_status.json | default({})).status | default('(unknown)') }}

          Likely causes:
            - 401 / 403: RENDER_API_KEY is invalid or lacks access. Re-check
              the Render dashboard -> Account -> API Keys and update .env.
            - 404: render_service_id ({{ render_service_id }}) is wrong;
              verify in Render dashboard -> service -> Settings -> General.
            - Render status `build_failed` / `update_failed` / `pre_deploy_failed`:
              build or pre-deploy script errored. Check Render dashboard logs.
            - Polling exhausted (15 min) without reaching `live`: deploy is
              stuck. Check Render dashboard for runtime errors.

          Fix the underlying issue, then re-run:
            make setup-prod-postapply

- name: Smoke 1 - backend /health returns 200
  block:
    - name: "Smoke 1 - GET {{ backend_url }}/health"
      ansible.builtin.uri:
        url: "{{ backend_url }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: health_resp
  rescue:
    - name: Smoke 1 (fail) - /health did not return 200
      ansible.builtin.fail:
        msg: |
          Backend /health did not return 200.
            URL    : {{ backend_url }}/health
            status : {{ health_resp.status | default('(connection error)') }}
            body   : {{ health_resp.content | default(health_resp.msg | default('(none)')) }}
          Likely causes:
            - 503 / cold-start race: deploy reached `live` but boot is still
              in progress. Wait ~30s and re-run `make setup-prod-postapply`.
            - 5xx: check Render logs for application errors.

- name: Smoke 2 - GraphQL /query reports health
  block:
    - name: "Smoke 2 - POST {{ backend_url }}/query"
      ansible.builtin.uri:
        url: "{{ backend_url }}/query"
        method: POST
        body_format: json
        body:
          query: "{ health }"
        status_code: 200
        return_content: true
      register: gql
  rescue:
    - name: Smoke 2 (fail) - /query did not return 200
      ansible.builtin.fail:
        msg: |
          Backend GraphQL /query did not return 200.
            URL    : {{ backend_url }}/query
            status : {{ gql.status | default('(connection error)') }}
            body   : {{ gql.content | default(gql.msg | default('(none)')) }}
          Likely causes:
            - 502 from Render edge during deploy cutover -- retry in ~30s.
            - 5xx: check Render logs for application errors.

- name: Smoke 2 (assert) - GraphQL data.health == "ok"
  ansible.builtin.assert:
    that:
      # `data is defined` guards against a 200 response carrying only `errors`
      # (e.g. {"errors":[...]}); without the guard the next predicate would
      # raise an undefined-attribute error rather than the intended fail_msg.
      - gql.json.data is defined
      - gql.json.data.health == "ok"
    fail_msg: |
      GraphQL health check returned an unexpected payload:
        {{ gql.json | to_nice_json }}
    success_msg: "GraphQL health check returned data.health == 'ok'."

# By the time we reach this probe, the Vercel deploy kick at the top of this
# phase has had several minutes to build (typically 1-2 min, parallel with
# the Render poll loop above). We allow up to 18 * 10s = 3 min here as a
# margin in case the Vercel build is slower than the Render rollout.
# block/rescue so connection errors (DNS / refused / TLS) surface with a
# meaningful message instead of being masked by `failed_when: false`.
- name: Smoke 3 - frontend HEAD returns 200 (absorbs Vercel build tail)
  block:
    - name: Smoke 3 - HEAD {{ production_url }}
      ansible.builtin.uri:
        url: "{{ production_url }}"
        method: HEAD
        status_code: 200
      register: frontend_head
      until: frontend_head.status == 200
      retries: 18
      delay: 10
  rescue:
    - name: Smoke 3 (fail) - frontend not reachable
      ansible.builtin.fail:
        msg: |
          Frontend HEAD {{ production_url }} did not return 200 after retries.
            last status: {{ frontend_head.status | default('connection error') }}
            error:       {{ frontend_head.msg | default('') }}
          Likely causes:
            - Vercel build still running or errored. Check
              https://vercel.com/<org>/<project>/deployments for deploy
              {{ vercel_deploy_id }} -- if it shows BUILDING, wait and re-run
              `make setup-prod-postapply`. If ERROR, click into the build
              log; the most common cause is a missing env var (Phase 4 should
              have registered all three -- re-run --tags vercel if needed).
            - `main` has no commits, so Vercel has nothing to build. Push a
              commit and re-run `make setup-prod-postapply`.

- name: Final summary - production endpoints
  ansible.builtin.debug:
    msg:
      - "Production bring-up complete."
      - "  Backend health:  {{ backend_url }}/health"
      - "  Backend GraphQL: {{ backend_url }}/query"
      - "  Frontend:        {{ production_url }}"
      - ""
      - "Manual follow-up: sign in with Google on the frontend and load /profile"
      - "to exercise the full Vercel -> Render -> Supabase chain."
      - "See docs/deployment.md section 'Smoke tests after the initial setup'."
