---
# Phase 3: Render web service bring-up.
#
# Reads:  state file (supabase_* keys written by Phase 2)
# Writes: state file adds render_service_id, backend_url, ping_token
# Side-effect: gh secret set RENDER_DEPLOY_HOOK_URL (idempotent overwrite)
#
# `state_file`, `repo`, and `confirm` come from the entry playbook
# (defaults: <repo-root>/.setup-prod.state.yml, confirm: false).
#
# Run via tag: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags render

- name: Phase 3 cannot run in unattended mode
  ansible.builtin.fail:
    msg: |
      Phase 3 (render) requires interactive operator input from the Render dashboard
      (service ID, URL, deploy hook URL). Cannot run with confirm=true.

      Either run interactively (default), or pre-populate render_service_id and
      backend_url in {{ state_file }} and skip Phase 3 entirely with --skip-tags render.
  when: confirm | bool

# Stat first so an absent state file produces the clear assert below,
# distinct from a corrupt-YAML parse error raised by from_yaml when the
# file is present but malformed.
- name: Stat state file (Phase 3)
  ansible.builtin.stat:
    path: "{{ state_file }}"
  register: _state_stat

# Read via set_fact (not include_vars) so the load survives a full-sequence
# `make setup-prod` run. An earlier phase set `existing_state = {}` via
# set_fact, which outranks include_vars (set_fact > include_vars in Ansible
# precedence) and would shadow a `include_vars name: existing_state` here,
# leaving this phase with an empty dict. set_fact + lookup overwrites it.
- name: Load state file (Phase 3 reads Phase 2 outputs)
  ansible.builtin.set_fact:
    existing_state: >-
      {{ (lookup('file', state_file) | from_yaml)
         if _state_stat.stat.exists else {} }}

# Coerce to a mapping so `existing_state.<key>` access and `| default(...)`
# behave consistently when the file is absent, empty, or YAML-null.
- name: Ensure existing_state is a mapping
  ansible.builtin.set_fact:
    existing_state: "{{ existing_state if (existing_state is defined and existing_state is mapping) else {} }}"

- name: Assert required Phase 2 keys are present
  ansible.builtin.assert:
    that:
      - _state_stat.stat.exists
      - (existing_state.supabase_project_ref | default('') | length) > 0
      - (existing_state.supabase_url | default('') | length) > 0
      - (existing_state.supabase_jwks_url | default('') | length) > 0
      - (existing_state.supabase_jwt_issuer | default('') | length) > 0
      - (existing_state.supabase_anon_key | default('') | length) > 0
      - (existing_state.supabase_db_url | default('') | length) > 0
    fail_msg: |
      Required state keys from Phase 2 (supabase) are missing or empty.
      Run Phase 2 first:
        ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags supabase

      If {{ state_file }} appears corrupt, restore from the most recent backup:
        cp "$(ls -1t {{ state_file }}.*~ 2>/dev/null | head -1)" {{ state_file }}
      then re-run Phase 3.

      Required keys: supabase_project_ref, supabase_url, supabase_jwks_url,
      supabase_jwt_issuer, supabase_anon_key, supabase_db_url.
    success_msg: "Phase 2 state keys present."

- name: Display Render Blueprint apply instructions
  ansible.builtin.debug:
    msg: |
      ============================================================
      RENDER DASHBOARD - Apply the Blueprint
      Repository: {{ repo }}
      ============================================================

      The structural config of the backend service (build/start
      commands, root dir, health check path, region, plan,
      auto-deploy policy, and the env-var SHAPE) lives in
      `render.yaml` at the repo root. The dashboard only needs to
      sync from it.

      First-time setup:
        1. New > Blueprint, point at {{ repo }} on branch `main`.
        2. Set Blueprint Name to `flamingo-armond`; leave Blueprint
           Path blank (it defaults to render.yaml at the repo root).
        3. Render reads render.yaml and creates the service
           `flamingo-backend` with all structural config. The static
           env vars (APP_ENV, GRAPHQL_INTROSPECTION,
           OTEL_TRACES_SAMPLER_ARG, SUPABASE_JWT_AUDIENCE) get their
           values from the Blueprint automatically.
        4. Under "Specified configurations", leave EVERY env-var Value
           field BLANK - they are all `sync: false` placeholders. Then
           click "Deploy Blueprint". Phase 6 (postapply) writes the
           dynamic values (SUPABASE_DB_URL / SUPABASE_JWKS_URL /
           SUPABASE_JWT_ISSUER, PING_TOKEN, SUPER_USER_EMAILS, NOTION_*)
           via the Render API; OTEL_EXPORTER_OTLP_ENDPOINT stays empty
           unless you opt into tracing.

      If the Blueprint Name shows "Name already in use":
        A `flamingo-armond` Blueprint already exists (a prior setup or
        an incomplete teardown). Do NOT create a second one. Cancel this
        form, open Blueprints -> flamingo-armond, confirm the
        `flamingo-backend` service is present, and reuse it - collect
        the service ID / URL / deploy hook from that existing service.

      Re-applying after render.yaml changes:
        Blueprints -> flamingo-armond -> Manual Sync.

      Auto-deploy stays off because schema migrations run on boot
      and we tie deploys to explicit pushes via the deploy hook
      registered in .github/workflows/backend.yml.
      ============================================================

- name: Wait for Render service creation
  ansible.builtin.pause:
    prompt: |

      Action required in the Render dashboard:
        1. Apply the Blueprint as described above. This CREATES the
           `flamingo-backend` service: set Blueprint Name to
           `flamingo-armond`, leave EVERY env-var Value field BLANK,
           then click "Deploy Blueprint". Because
           `autoDeployTrigger: "off"` is set in render.yaml, no deploy
           runs yet - Phase 6 (postapply) triggers the first deploy via
           the Render API, so the steps below do NOT require a completed
           deploy.

           If "Name already in use" appears, the Blueprint already
           exists: cancel, open Blueprints -> flamingo-armond, and reuse
           its `flamingo-backend` service for the values below.
        2. Copy the service ID (srv-...) from the service's
           Settings > General.
        3. Copy the service URL (https://....onrender.com) from the top
           of the service page.
        4. Copy the deploy hook URL from Settings > Deploy Hook.

      Press Enter when the service exists and you have all three values ready.

# --- Collect render_service_id (empty input keeps existing) ---
- name: Prompt for Render service ID
  ansible.builtin.pause:
    prompt: |-
      Render service ID (format: srv-<alphanumeric>).
      Look on the `flamingo-backend` SERVICE page - NOT the Blueprint page:
        Blueprints > flamingo-armond > Resources > open `flamingo-backend`
        > Settings > General > "Service ID".
      Shortcut: it is the srv-... in the service page URL
        https://dashboard.render.com/web/srv-...
      Do NOT paste the Blueprint ID (exs-...) or the Blueprint "Sync Hook".

      Service ID [current: {{ existing_state.render_service_id | default('(none)') }}] (press Enter to keep current)
  register: _render_service_id_input

- name: Resolve render_service_id (keep existing on empty input)
  ansible.builtin.set_fact:
    render_service_id: >-
      {{ (_render_service_id_input.user_input | default('') | trim)
         if (_render_service_id_input.user_input | default('') | trim | length) > 0
         else existing_state.render_service_id | default('') }}

- name: Validate render_service_id format
  ansible.builtin.assert:
    that:
      - render_service_id is match('^srv-[a-z0-9]+$')
    fail_msg: |
      render_service_id '{{ render_service_id }}' does not match the expected
      pattern srv-<alphanumeric>. Find it in Render: Settings > General.

# --- Collect backend_url (empty input keeps existing) ---
- name: Prompt for Render backend URL
  ansible.builtin.pause:
    prompt: |-
      Render backend URL (https://...).
      On the `flamingo-backend` SERVICE page, copy the URL shown at the top
      of the page, e.g. https://flamingo-backend.onrender.com.
      A custom domain is fine; it need not end in .onrender.com.

      Backend URL [current: {{ existing_state.backend_url | default('(none)') }}] (press Enter to keep current)
  register: _backend_url_input

- name: Resolve backend_url (keep existing on empty input)
  ansible.builtin.set_fact:
    backend_url: >-
      {{ (_backend_url_input.user_input | default('') | trim)
         if (_backend_url_input.user_input | default('') | trim | length) > 0
         else existing_state.backend_url | default('') }}

- name: Validate backend_url format
  ansible.builtin.assert:
    that:
      - backend_url is match('^https://.+$')
    fail_msg: |
      backend_url '{{ backend_url }}' must start with https://.
      Custom domains are accepted; the URL does not have to end in .onrender.com.

# --- Check whether RENDER_DEPLOY_HOOK_URL is already a GitHub Actions secret.
# The deploy-hook URL itself is not stored in the state file (sensitive,
# single-use registration sink), so we cannot show it back in the prompt. We
# can, however, check whether the GH secret already exists and let the
# operator skip re-prompt + re-registration on a re-run. `gh secret list`
# only reveals names, not values, so this check is safe to log.
- name: Check whether RENDER_DEPLOY_HOOK_URL secret already exists
  ansible.builtin.shell:
    cmd: gh secret list --repo {{ repo }} --json name -q '[.[] | select(.name == "RENDER_DEPLOY_HOOK_URL")] | length'
  register: _gh_secret_check
  changed_when: false
  failed_when: false

- name: Determine deploy-hook secret presence
  ansible.builtin.set_fact:
    deploy_hook_already_registered: "{{ (_gh_secret_check.rc == 0) and ((_gh_secret_check.stdout | default('0') | trim | int) > 0) }}"

# --- Collect deploy hook URL (no_log; empty input keeps existing GH secret if registered) ---
- name: Prompt for Render deploy hook URL
  ansible.builtin.pause:
    prompt: |-
      Render deploy hook URL (https://api.render.com/deploy/...).
      On the `flamingo-backend` SERVICE page: Settings > Deploy Hook.
      This is the SERVICE deploy hook - NOT the Blueprint "Sync Hook"
      on the Blueprint settings page (that one starts differently and
      will be rejected by the format check below).

      Deploy hook URL [current: {{ '(registered in GitHub; press Enter to keep)' if deploy_hook_already_registered else '(not registered yet)' }}]
  no_log: true
  register: _deploy_hook_input

- name: Store deploy_hook_url fact (empty if keeping existing GH secret)
  ansible.builtin.set_fact:
    deploy_hook_url: "{{ _deploy_hook_input.user_input | default('') | trim }}"
  no_log: true

# Hard-fail only when the operator entered nothing AND the secret has never
# been registered. Re-runs that intentionally keep the existing secret pass
# this gate via deploy_hook_already_registered=true.
- name: Require deploy hook URL on first run
  ansible.builtin.fail:
    msg: |
      RENDER_DEPLOY_HOOK_URL is not yet registered in GitHub and no value was
      provided. Copy the deploy hook URL from Render: Settings > Deploy Hook,
      then re-run:
        ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags render
  when:
    - (deploy_hook_url | length) == 0
    - not deploy_hook_already_registered

- name: Validate deploy hook URL format
  ansible.builtin.assert:
    that:
      - deploy_hook_url is match('^https://api\.render\.com/deploy/')
    fail_msg: |
      deploy_hook_url must start with https://api.render.com/deploy/.
      Copy it from Render: Settings > Deploy Hook.
  when: (deploy_hook_url | length) > 0
  no_log: true

# --- Register deploy hook as GitHub Actions secret ---
# `stdin_add_newline: false` is critical: the default true would store the
# deploy-hook URL with a trailing `\n`, which makes the CI's
# `curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"` fail with code=000 and break
# every push-triggered deploy until the secret is manually re-set.
#
# Skipped on re-runs that kept the existing secret (empty input above).
- name: Register RENDER_DEPLOY_HOOK_URL as a GitHub Actions secret
  ansible.builtin.shell:
    cmd: gh secret set RENDER_DEPLOY_HOOK_URL --repo {{ repo }}
    stdin: "{{ deploy_hook_url }}"
    stdin_add_newline: false
  register: _gh_secret_result
  no_log: true
  failed_when: false
  changed_when: _gh_secret_result.rc == 0
  when: (deploy_hook_url | length) > 0

- name: Fail with remediation if gh secret set failed
  ansible.builtin.fail:
    msg: |
      gh secret set failed (rc={{ _gh_secret_result.rc }}).

      gh diagnostic:
        stderr: {{ _gh_secret_result.stderr | default('(none)') }}
        stdout: {{ _gh_secret_result.stdout | default('(none)') }}

      Common causes:
        - gh CLI lost the `repo` write scope.  Re-run:
            gh auth refresh -s repo
        - GitHub API rate limit. Wait a minute and retry.
        - `repo` var is wrong / repo not found. Verify {{ repo }} is correct.

      Then retry: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags render
  when:
    - (deploy_hook_url | length) > 0
    - _gh_secret_result.rc | default(0) != 0

- name: Confirm GitHub secret registered
  ansible.builtin.debug:
    msg: >-
      {{ 'RENDER_DEPLOY_HOOK_URL registered as a GitHub Actions secret in ' ~ repo ~ '.'
         if (deploy_hook_url | length) > 0
         else 'RENDER_DEPLOY_HOOK_URL kept as-is (existing GitHub Actions secret in ' ~ repo ~ ').' }}

# --- Reuse PING_TOKEN from state, or generate if missing ---
# The token is auto-generated (no external source); generating it here, in
# Phase 3, means it is available in the state file before Phase 6 needs to
# push it to Render via the API. Idempotent: when the state file already
# carries a non-empty ping_token (re-run of Phase 3), the existing value is
# kept; otherwise a fresh token is generated.
- name: Reuse or generate PING_TOKEN
  ansible.builtin.set_fact:
    ping_token: >-
      {{ existing_state.ping_token
         if ((existing_state.ping_token | default('') | string | trim | length) > 0)
         else lookup('pipe', 'openssl rand -hex 32') }}
  no_log: true

# --- Persist render_service_id, backend_url, and ping_token into state file ---
# State file is known to exist at this point (assert above would have failed
# otherwise), so re-reading via lookup is safe without errors='ignore'.
# no_log on both tasks: the merged dict carries supabase_db_url (DB password)
# and ping_token.
- name: Merge new values into existing state
  ansible.builtin.set_fact:
    state_merged: >-
      {{ (lookup('file', state_file) | from_yaml)
         | combine({
             'render_service_id': render_service_id,
             'backend_url': backend_url,
             'ping_token': ping_token,
           }) }}
  no_log: true

# `backup: yes` uses shutil.copy2 which preserves source mode bits, so the
# backup is already created at 0600 (matching the live state file).
- name: Persist state file
  ansible.builtin.copy:
    content: "{{ state_merged | to_nice_yaml(sort_keys=true) }}"
    dest: "{{ state_file }}"
    mode: '0600'
    backup: yes
  no_log: true

- name: Phase 3 complete
  ansible.builtin.debug:
    msg: |
      Phase 3 complete.
        render_service_id : {{ render_service_id }}
        backend_url       : {{ backend_url }}
        ping_token        : (generated; stored in state file -- do not print)
      State written to {{ state_file }}.
      Next: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags vercel
