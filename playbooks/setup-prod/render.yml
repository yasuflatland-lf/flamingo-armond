---
# Phase 3: Render web service bring-up.
#
# Reads:  state file (supabase_* keys written by Phase 2)
# Writes: state file adds render_service_id, backend_url
# Side-effect: gh secret set RENDER_DEPLOY_HOOK_URL (idempotent overwrite)
#
# `state_file`, `repo`, and `confirm` come from the entry playbook
# (defaults: <repo-root>/.setup-prod.state.yml, confirm: false).
#
# Run via tag: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags render

- name: Phase 3 cannot run in unattended mode
  ansible.builtin.fail:
    msg: |
      Phase 3 (render) requires interactive operator input from the Render dashboard
      (service ID, URL, deploy hook URL). Cannot run with confirm=true.

      Either run interactively (default), or pre-populate render_service_id and
      backend_url in {{ state_file }} and skip Phase 3 entirely with --skip-tags render.
  when: confirm | bool

# Stat first so YAML parse errors fail loudly instead of being masked by
# `failed_when: false` on include_vars and surfacing as confusing
# "missing keys" later in the assert.
- name: Stat state file (Phase 3)
  ansible.builtin.stat:
    path: "{{ state_file }}"
  register: _state_stat

- name: Load state file (Phase 3 reads Phase 2 outputs)
  ansible.builtin.include_vars:
    file: "{{ state_file }}"
  when: _state_stat.stat.exists

- name: Assert required Phase 2 keys are present
  ansible.builtin.assert:
    that:
      - _state_stat.stat.exists
      - supabase_project_ref is defined and (supabase_project_ref | length) > 0
      - supabase_url is defined and (supabase_url | length) > 0
      - supabase_jwks_url is defined and (supabase_jwks_url | length) > 0
      - supabase_jwt_issuer is defined and (supabase_jwt_issuer | length) > 0
      - supabase_anon_key is defined and (supabase_anon_key | length) > 0
      - supabase_db_url is defined and (supabase_db_url | length) > 0
    fail_msg: |
      Required state keys from Phase 2 (supabase) are missing or empty.
      Run Phase 2 first:
        ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags supabase

      If {{ state_file }} appears corrupt, restore from the most recent backup:
        cp "$(ls -1t {{ state_file }}.*~ 2>/dev/null | head -1)" {{ state_file }}
      then re-run Phase 3.

      Required keys: supabase_project_ref, supabase_url, supabase_jwks_url,
      supabase_jwt_issuer, supabase_anon_key, supabase_db_url.
    success_msg: "Phase 2 state keys present."

- name: Display Render Blueprint apply instructions
  ansible.builtin.debug:
    msg: |
      ============================================================
      RENDER DASHBOARD - Apply the Blueprint
      Repository: {{ repo }}
      ============================================================

      The structural config of the backend service (build/start
      commands, root dir, health check path, region, plan,
      auto-deploy policy, and the env-var SHAPE) lives in
      `render.yaml` at the repo root. The dashboard only needs to
      sync from it.

      First-time setup:
        1. New > Blueprint, point at {{ repo }} on branch `main`.
        2. Render reads render.yaml and creates the service
           `flamingo-backend` with all structural config.
        3. The static env vars (APP_ENV, GRAPHQL_INTROSPECTION,
           OTEL_TRACES_SAMPLER_ARG, SUPABASE_JWT_AUDIENCE) get their
           values from the Blueprint automatically.
        4. The dashboard prompts for the `sync: false` placeholders
           (SUPABASE_DB_URL, SUPABASE_JWKS_URL, SUPABASE_JWT_ISSUER,
           OTEL_EXPORTER_OTLP_ENDPOINT). Leave them BLANK and click
           Save - Phase 6 (postapply) writes the Supabase-derived
           values via the Render API.

      Re-applying after render.yaml changes:
        Blueprints -> flamingo-armond -> Manual Sync.

      Auto-deploy stays off because schema migrations run on boot
      and we tie deploys to explicit pushes via the deploy hook
      registered in .github/workflows/backend.yml.
      ============================================================

- name: Wait for Render service creation
  ansible.builtin.pause:
    prompt: |

      Action required in the Render dashboard:
        1. Apply the Blueprint as described above. Because
           `autoDeployTrigger: "off"` is set in render.yaml, no deploy
           will run yet - Phase 6 (postapply) triggers the first deploy
           via the Render API. The next steps below do NOT require a
           completed deploy.
        2. Copy the service ID (srv-...) from Settings > General.
        3. Copy the service URL (https://....onrender.com) from the top
           of the page.
        4. Copy the deploy hook URL from Settings > Deploy Hook.

      Press Enter when the service is created and you have all three values ready.

# --- Collect render_service_id ---
- name: Prompt for Render service ID
  ansible.builtin.pause:
    prompt: "Render service ID (format: srv-<alphanumeric>)"
  register: _render_service_id_input

- name: Store render_service_id fact
  ansible.builtin.set_fact:
    render_service_id: "{{ _render_service_id_input.user_input | trim }}"

- name: Validate render_service_id format
  ansible.builtin.assert:
    that:
      - render_service_id is match('^srv-[a-z0-9]+$')
    fail_msg: |
      render_service_id '{{ render_service_id }}' does not match the expected
      pattern srv-<alphanumeric>. Find it in Render: Settings > General.

# --- Collect backend_url ---
- name: Prompt for Render backend URL
  ansible.builtin.pause:
    prompt: "Render backend URL (https://...onrender.com, or custom domain starting with https://)"
  register: _backend_url_input

- name: Store backend_url fact
  ansible.builtin.set_fact:
    backend_url: "{{ _backend_url_input.user_input | trim }}"

- name: Validate backend_url format
  ansible.builtin.assert:
    that:
      - backend_url is match('^https://.+$')
    fail_msg: |
      backend_url '{{ backend_url }}' must start with https://.
      Custom domains are accepted; the URL does not have to end in .onrender.com.

# --- Collect deploy hook URL (no_log) ---
- name: Prompt for Render deploy hook URL
  ansible.builtin.pause:
    prompt: "Render deploy hook URL (https://api.render.com/deploy/...)"
  no_log: true
  register: _deploy_hook_input

- name: Store deploy_hook_url fact
  ansible.builtin.set_fact:
    deploy_hook_url: "{{ _deploy_hook_input.user_input | trim }}"
  no_log: true

- name: Validate deploy hook URL format
  ansible.builtin.assert:
    that:
      - deploy_hook_url is match('^https://api\.render\.com/deploy/')
    fail_msg: |
      deploy_hook_url must start with https://api.render.com/deploy/.
      Copy it from Render: Settings > Deploy Hook.
  no_log: true

# --- Register deploy hook as GitHub Actions secret ---
# `stdin_add_newline: false` is critical: the default true would store the
# deploy-hook URL with a trailing `\n`, which makes the CI's
# `curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"` fail with code=000 and break
# every push-triggered deploy until the secret is manually re-set.
- name: Register RENDER_DEPLOY_HOOK_URL as a GitHub Actions secret
  ansible.builtin.shell:
    cmd: gh secret set RENDER_DEPLOY_HOOK_URL --repo {{ repo }}
    stdin: "{{ deploy_hook_url }}"
    stdin_add_newline: false
  register: _gh_secret_result
  no_log: true
  failed_when: false
  changed_when: _gh_secret_result.rc == 0

- name: Fail with remediation if gh secret set failed
  ansible.builtin.fail:
    msg: |
      gh secret set failed (rc={{ _gh_secret_result.rc }}).

      gh diagnostic:
        stderr: {{ _gh_secret_result.stderr | default('(none)') }}
        stdout: {{ _gh_secret_result.stdout | default('(none)') }}

      Common causes:
        - gh CLI lost the `repo` write scope.  Re-run:
            gh auth refresh -s repo
        - GitHub API rate limit. Wait a minute and retry.
        - `repo` var is wrong / repo not found. Verify {{ repo }} is correct.

      Then retry: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags render
  when: _gh_secret_result.rc != 0

- name: Confirm GitHub secret registered
  ansible.builtin.debug:
    msg: "RENDER_DEPLOY_HOOK_URL registered as a GitHub Actions secret in {{ repo }}."

# --- Persist render_service_id and backend_url into state file ---
# State file is known to exist at this point (assert above would have failed
# otherwise), so re-reading via lookup is safe without errors='ignore'.
# no_log on both tasks: the merged dict carries supabase_db_url (DB password).
- name: Merge new values into existing state
  ansible.builtin.set_fact:
    state_merged: >-
      {{ (lookup('file', state_file) | from_yaml)
         | combine({
             'render_service_id': render_service_id,
             'backend_url': backend_url,
           }) }}
  no_log: true

# `backup: yes` uses shutil.copy2 which preserves source mode bits, so the
# backup is already created at 0600 (matching the live state file).
- name: Persist state file
  ansible.builtin.copy:
    content: "{{ state_merged | to_nice_yaml(sort_keys=true) }}"
    dest: "{{ state_file }}"
    mode: '0600'
    backup: yes
  no_log: true

- name: Phase 3 complete
  ansible.builtin.debug:
    msg: |
      Phase 3 complete.
        render_service_id : {{ render_service_id }}
        backend_url       : {{ backend_url }}
      State written to {{ state_file }}.
      Next: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags vercel
