---
# playbooks/setup-prod/supabase.yml
#
# Implements Step 1 (project create) and Step 4 (loopback) of
# `docs/deployment.md`. The entry playbook (`setup-prod.yml`) imports this
# file twice with different `step` values:
#
#   - import_tasks: setup-prod/supabase.yml
#     vars: { step: create }     # runs the Step 1 block
#   - import_tasks: setup-prod/supabase.yml
#     vars: { step: loopback }   # runs the Step 4 block
#
# `state_file` and `confirm` come from the entry playbook (defaults: state
# at `<repo-root>/.setup-prod.state.yml`, confirm: false).

# ---------------------------------------------------------------------------
# Step 1 block: create Supabase project + collect values into state.
# ---------------------------------------------------------------------------
- name: "Step 1 - Supabase project create"
  when: step == 'create'
  block:

    - name: Phase 2 (Step 1) cannot run in unattended mode
      ansible.builtin.fail:
        msg: |
          Phase 2 Step 1 (supabase create) requires interactive operator input from the
          Supabase dashboard (project ref, publishable anon key, session pooler DSN).
          Cannot run with confirm=true.

          Either run interactively (default), or pre-populate supabase_project_ref,
          supabase_anon_key, supabase_db_url (and the derived URLs) in {{ state_file }}
          and skip Step 1 with --skip-tags supabase.
      # Outer block already gates on step == 'create'; this only adds the confirm check.
      when: confirm | bool

    # --- Load existing state so prompts can show current defaults. -------
    # Stat first so we can distinguish "first run" (file absent) from
    # "corrupt YAML" (file present but unparseable). The latter would
    # otherwise be masked by `failed_when: false` on include_vars and
    # surface as a confusing "missing keys" assert later on.
    - name: Stat state file (Step 1)
      ansible.builtin.stat:
        path: "{{ state_file }}"
      register: _state_stat

    - name: Load state file (Step 1)
      ansible.builtin.include_vars:
        file: "{{ state_file }}"
        name: existing_state
      when: _state_stat.stat.exists

    - name: Initialize empty existing_state for first-run case
      ansible.builtin.set_fact:
        existing_state: {}
      when: not _state_stat.stat.exists

    # First-write detector: true only when the state file did not yet exist
    # (or was empty). Used to gate the one-shot security warning at the
    # end of this block.
    - name: Compute whether this run will create the state file
      ansible.builtin.set_fact:
        state_just_created: "{{ not _state_stat.stat.exists or (existing_state | length) == 0 }}"

    - name: Show Step 1 dashboard procedure
      ansible.builtin.pause:
        prompt: |
          Step 1 - Supabase project create
          --------------------------------
          1. Open https://supabase.com/dashboard and create a new project.
             Record the region (keep it close to the Render region; the
             repo-wide default is ap-northeast-1) and the DB password.
             Store the DB password in your password manager - it is only
             shown once and is not retrievable from the dashboard later.
          2. In the new project, open Authentication -> Sign In / Up and
             enable Google. Paste the Client ID and secret from the
             Google OAuth client created in Manual prerequisites section 3.
          3. Wait for project provisioning to finish (~5-15 minutes) before
             continuing. The next prompts ask for values from the dashboard.

          Press Enter to continue.
      when: not confirm

    # --- Project ref: prompted, then validated, then used to derive URLs. -
    - name: Prompt for Supabase project ref
      ansible.builtin.pause:
        prompt: "Supabase project ref [current: {{ existing_state.supabase_project_ref | default('(none)') }}]"
        echo: true
      register: project_ref_prompt
      when: not confirm

    # Empty input keeps the existing value (re-run ergonomics).
    - name: Resolve supabase_project_ref (keep existing on empty input)
      ansible.builtin.set_fact:
        supabase_project_ref: >-
          {{ (project_ref_prompt.user_input | default('') | trim)
             if (project_ref_prompt.user_input | default('') | trim | length) > 0
             else existing_state.supabase_project_ref | default('') }}

    - name: Validate supabase_project_ref shape
      ansible.builtin.assert:
        that:
          - supabase_project_ref is match('^[a-z0-9]{15,30}$')
        fail_msg: >-
          supabase_project_ref must be lowercase letters and digits, length 15-30.
          Got: '{{ supabase_project_ref }}'.

    # --- Derive public URLs from project ref (Tier 3, no no_log). --------
    - name: Derive Supabase URLs from project ref
      ansible.builtin.set_fact:
        supabase_url: "https://{{ supabase_project_ref }}.supabase.co"
        supabase_jwks_url: "https://{{ supabase_project_ref }}.supabase.co/auth/v1/.well-known/jwks.json"
        supabase_jwt_issuer: "https://{{ supabase_project_ref }}.supabase.co/auth/v1"

    # --- Sensitive values (Tier 1/2): no_log on prompt and verification. -
    - name: Prompt for Supabase publishable (anon) key
      ansible.builtin.pause:
        prompt: "Supabase publishable key (API Keys -> Publishable; sb_publishable_...)"
        echo: false
      register: anon_key_prompt
      no_log: true
      when: not confirm

    - name: Resolve supabase_anon_key (keep existing on empty input)
      ansible.builtin.set_fact:
        supabase_anon_key: >-
          {{ (anon_key_prompt.user_input | default('') | trim)
             if (anon_key_prompt.user_input | default('') | trim | length) > 0
             else existing_state.supabase_anon_key | default('') }}
      no_log: true

    - name: Prompt for Supabase session-pooler DSN
      ansible.builtin.pause:
        prompt: "Supabase DB URL (Connect -> Session pooler tab; postgres://...?sslmode=require)"
        echo: false
      register: db_url_prompt
      no_log: true
      when: not confirm

    - name: Resolve supabase_db_url (keep existing on empty input)
      ansible.builtin.set_fact:
        supabase_db_url: >-
          {{ (db_url_prompt.user_input | default('') | trim)
             if (db_url_prompt.user_input | default('') | trim | length) > 0
             else existing_state.supabase_db_url | default('') }}
      no_log: true

    # Catch transaction-pooler / non-pooler mistakes early. golang-migrate
    # uses advisory locks that need a real session, so we require the
    # session pooler host (contains "pooler") plus sslmode=require.
    - name: Validate supabase_db_url shape (session pooler + sslmode)
      ansible.builtin.assert:
        that:
          - "'?sslmode=require' in supabase_db_url"
          - "'pooler' in supabase_db_url"
        fail_msg: >-
          supabase_db_url must come from the Session pooler tab and include
          ?sslmode=require. Re-copy from Connect -> Session pooler.
      no_log: true

    # --- Light reachability probe. REST root may return 404 but proves
    # DNS + TLS + auth header are wired. 200 also acceptable.
    # Wrapped so a wrong project ref / anon key surfaces a useful message
    # instead of a censored Ansible default error.
    - name: Probe Supabase REST endpoint (proves DNS/TLS/auth)
      block:
        - name: "GET {{ supabase_url }}/rest/v1/"
          ansible.builtin.uri:
            url: "{{ supabase_url }}/rest/v1/"
            method: GET
            headers:
              apikey: "{{ supabase_anon_key }}"
              Authorization: "Bearer {{ supabase_anon_key }}"
            status_code: [200, 404]
            return_content: false
          register: _supabase_probe
          no_log: true
      rescue:
        - name: Surface Supabase probe failure
          ansible.builtin.fail:
            msg: |
              Supabase REST probe at {{ supabase_url }}/rest/v1/ failed.

                HTTP status : {{ _supabase_probe.status | default('(connection error)') }}
                Error       : {{ _supabase_probe.msg | default('(none)') }}

              Likely causes:
                - Wrong project ref. Re-check Supabase -> General -> Project ID.
                - Wrong publishable (anon) key. Re-check Supabase -> API Keys -> Publishable.
                - Project still provisioning (~5-15 min after create).
                - Network / DNS issue.

              Fix the prompted value(s), then re-run:
                ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags supabase

    # --- Persist 6 keys to state file (merge with whatever else is there).
    # Reuse _state_stat from Step 1 entry: at task start the file either
    # existed (so re-reading is safe) or did not (so start from {}).
    - name: Merge new Supabase values into state
      ansible.builtin.set_fact:
        state_merged: >-
          {{ ((lookup('file', state_file) | from_yaml) if _state_stat.stat.exists else {})
             | combine({
                 'supabase_project_ref': supabase_project_ref,
                 'supabase_url': supabase_url,
                 'supabase_jwks_url': supabase_jwks_url,
                 'supabase_jwt_issuer': supabase_jwt_issuer,
                 'supabase_anon_key': supabase_anon_key,
                 'supabase_db_url': supabase_db_url,
               }) }}
      no_log: true

    - name: Persist state file (mode 0600 + backup)
      ansible.builtin.copy:
        content: "{{ state_merged | to_nice_yaml(sort_keys=true) }}"
        dest: "{{ state_file }}"
        mode: "0600"
        backup: yes
      register: _state_persist
      no_log: true

    # Ansible's `backup: yes` writes the backup file with default umask
    # (typically 0644), so the prior DB password would briefly land at
    # world-readable mode. Re-chmod the most recent backup to 0600.
    - name: Lock down state-file backup mode
      ansible.builtin.file:
        path: "{{ _state_persist.backup_file }}"
        mode: "0600"
      when:
        - _state_persist.backup_file is defined
        - (_state_persist.backup_file | length) > 0

    # --- One-shot security warning, only on the very first state write. -
    - name: Show first-write security warning
      ansible.builtin.debug:
        msg:
          - "state written to {{ state_file }} (mode 0600)."
          - "This file contains your Supabase DB password and other secrets."
          - "  - Gitignored: yes"
          - "  - Single-operator artifact: do not share, commit, or copy across machines"
          - "  - Re-runs read default values from this file"
      when: state_just_created

# ---------------------------------------------------------------------------
# Step 4 block: loop back to Supabase with real Vercel URL + OAuth redirect.
# Display-only phase: no state writes, no API calls (Google OAuth redirect
# URI is not readable via API, and Supabase-side reads are low ROI here).
# ---------------------------------------------------------------------------
- name: "Step 4 - Supabase loopback"
  when: step == 'loopback'
  block:

    - name: Phase 5 (Step 4 loopback) cannot run in unattended mode
      ansible.builtin.fail:
        msg: |
          Phase 5 Step 4 (supabase loopback) requires the operator to update Site URL,
          Redirect URLs, and Google OAuth redirect URI on external dashboards. These
          cannot be applied programmatically. Cannot run with confirm=true.

          Run interactively to see the values to paste into:
            - Supabase Auth -> URL Configuration
            - Google Cloud Console -> OAuth client redirect URIs
      # Outer block already gates on step == 'loopback'; this only adds the confirm check.
      when: confirm | bool

    # --- Load state. Phase 4 (vercel) must have written production_url. --
    # Step 4 is never a valid first-run, so missing file is itself a misuse.
    # Stat first so a missing file vs. corrupt YAML produce distinct errors.
    - name: Stat state file (Step 4)
      ansible.builtin.stat:
        path: "{{ state_file }}"
      register: _state_stat

    - name: Load state file (Step 4)
      ansible.builtin.include_vars:
        file: "{{ state_file }}"
      when: _state_stat.stat.exists

    - name: Assert Phase 4 (vercel) has run
      ansible.builtin.assert:
        that:
          - _state_stat.stat.exists
          - production_url is defined
          - supabase_project_ref is defined
        fail_msg: >-
          Required state values for Step 4 (loopback) are missing. This step
          needs both `production_url` (written by Phase 4 vercel) and
          `supabase_project_ref` (written by Phase 2 supabase).

          Possible causes:
          - Phase 2 and/or Phase 4 have not yet run.
            Re-run with: ansible-playbook -i playbooks/inventory.local playbooks/setup-prod.yml --tags supabase,vercel
          - The state file is corrupt or was hand-edited.
            Restore from the most recent backup:
              cp "$(ls -1t {{ state_file }}.*~ 2>/dev/null | head -1)" {{ state_file }}

    - name: Show Step 4 loopback actions with real values
      ansible.builtin.pause:
        prompt: |
          Step 4 - Loop back to Supabase
          ------------------------------
          Update three settings in two dashboards. Values are interpolated
          from the state file.

          1. Supabase dashboard -> Authentication -> URL Configuration:
                Site URL = {{ production_url }}

          2. Supabase dashboard -> Authentication -> URL Configuration ->
             Redirect URLs: add the entry
                {{ production_url }}/auth/callback

          3. Google Cloud Console -> APIs & Services -> Credentials ->
             your OAuth 2.0 Client (from Manual prerequisites section 3):
             replace the placeholder Authorized redirect URI with
                https://{{ supabase_project_ref }}.supabase.co/auth/v1/callback

          The /profile end-to-end sign-in is the real test for these.

          Press Enter once all three are saved.
      when: not confirm
