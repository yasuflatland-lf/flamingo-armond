# Render Blueprint for flamingo-armond.
#
# This file is the source of truth for the structural config of the
# production backend service: build/start commands, root dir, health check
# path, region, plan, auto-deploy policy, and the SHAPE of the env-var set.
#
# What lives here vs. what the playbook writes via API:
#   - Static env var VALUES (APP_ENV, GRAPHQL_INTROSPECTION,
#     OTEL_TRACES_SAMPLER_ARG, SUPABASE_JWT_AUDIENCE) are declared with
#     `value:` and are reconciled by Blueprint sync.
#   - Dynamic env var VALUES (SUPABASE_DB_URL, SUPABASE_JWKS_URL,
#     SUPABASE_JWT_ISSUER, PING_TOKEN) are declared with `sync: false` so
#     Blueprint only creates the placeholder; the actual value is upserted
#     by `playbooks/setup-prod/postapply.yml` via
#     `PUT /v1/services/{id}/env-vars/{key}` after the relevant setup phases
#     have produced the derived values.
#   - SUPER_USER_EMAILS is operator-discretionary: declared `sync: false`
#     and left for the operator to set manually in the dashboard. Empty
#     means the bootstrap admin feature is OFF, which is the safe default.
#   - OTEL_EXPORTER_OTLP_ENDPOINT is operator-discretionary: declared
#     `sync: false` and left for the operator to set manually in the
#     dashboard. Empty means no-op tracing.
#
# Operator workflow on first apply / when this file changes:
#   1. Push the change to `main`.
#   2. Render dashboard -> Blueprints -> flamingo-armond -> Manual Sync.
#   3. Re-run `make setup-prod-postapply` so the dynamic env vars and a
#      fresh deploy are reconciled.
#
# `autoDeployTrigger: "off"` is the modern replacement for the deprecated
# `autoDeploy: false`. Quoted because YAML 1.1 coerces bare `off` to a
# boolean. Auto-deploy stays disabled because schema migrations run on
# boot and we tie deploys to explicit pushes via the deploy hook
# registered in `.github/workflows/backend.yml`.

services:
  - type: web
    name: flamingo-backend
    runtime: go
    region: oregon
    plan: free
    rootDir: backend
    # `go tool gqlgen generate` runs because backend/graph/generated/ and
    # graph/model/models_gen.go are gitignored (see root .gitignore §"Generated
    # code"). CI regenerates them via the same command in
    # .github/workflows/backend.yml; Render must mirror that step or the build
    # fails with "package backend/graph/generated is not in std".
    buildCommand: go mod download && go tool gqlgen generate && go build -o main ./cmd/server
    startCommand: ./main
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: GRAPHQL_INTROSPECTION
        value: "off"
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "0.1"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: PING_TOKEN
        sync: false
      - key: SUPER_USER_EMAILS
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_PAGE_IDS
        sync: false
      - key: NOTION_TARGET_OWNER_ID
        sync: false
      - key: NOTION_TARGET_CARDGROUP_NAME
        sync: false
      - key: NOTION_SYNC_TOKEN
        sync: false
      - key: NOTION_MAX_ATTEMPTS
        sync: false
      - key: NOTION_MAX_ELAPSED
        sync: false
