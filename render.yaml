version: "1"

services:
  - type: web
    plan: free
    name: flamingo-backend
    runtime: go
    repo: https://github.com/yasuflatland-lf/flamingo-armond
    rootDir: backend
    autoDeploy: false
    buildCommand: go mod download && go build -o main ./cmd/server
    startCommand: ./main
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: GRAPHQL_INTROSPECTION
        value: off
