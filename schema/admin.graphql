"""A named permission role. Names are stored lowercase (e.g., "admin", "general")."""
type Role {
  id: ID!
  name: String!
}

"""Success result of `updateRole`. Returned when the role rename succeeded."""
type UpdateRoleSuccess {
  role: Role!
}

"""
Returned by `updateRole` when the target role is a system role
("admin", "general"). System roles are immutable by domain invariant — the
backend refuses the rename regardless of caller privilege.

The variant carries the offending role's identity so the client can render
"system role 'admin' cannot be renamed" without re-fetching.
"""
type CannotModifySystemRoleError implements UserError {
  message: String!
  roleId: ID!
  roleName: String!
}

"""
Result of `updateRole`. Either the updated role, or a typed
CannotModifySystemRoleError describing the system-role guard.
"""
union UpdateRoleResult = UpdateRoleSuccess | CannotModifySystemRoleError

"""
Typed business error returned by `adminEditUser` when the caller attempts to
remove the admin role from their own account. Self-demotion is rejected by the
server regardless of caller privilege.
"""
type CannotRevokeOwnAdminRoleError implements UserError {
  message: String!
}

"""
Returned by `adminEditUser` when the submitted expected version does not
match the target user's current optimistic-concurrency token.
"""
type ConcurrentUpdateError implements UserError {
  message: String!
}

"""
Returned by `adminEditUser` when the admin's profile and role edit succeeded.
Carries the updated `user` so clients can refresh the profile and role view
without a follow-up query.
"""
type AdminEditUserSuccess {
  user: User!
}

"""
Returned by `createRole` when a new role was successfully created. Carries
the freshly inserted `role` so clients can insert it into local caches
without a follow-up query.
"""
type CreateRoleSuccess {
  role: Role!
}

"""
Result of `adminEditUser`. Either the updated user, an input-validation
failure, a CannotRevokeOwnAdminRoleError when the caller tries to demote
themselves, or a ConcurrentUpdateError when the submitted version is stale.
"""
union AdminEditUserResult =
    AdminEditUserSuccess
  | InputValidationError
  | CannotRevokeOwnAdminRoleError
  | ConcurrentUpdateError

"""Result of `createRole`. Either the new role or an input-validation failure."""
union CreateRoleResult =
    CreateRoleSuccess
  | InputValidationError

extend type User {
  """Roles assigned to this user. Resolved via the per-request RoleByUserID DataLoader."""
  roles: [Role!]!
}

"""One element in a UserConnection."""
type UserEdge {
  """Opaque cursor for this position. Currently equal to node.id."""
  cursor: ID!
  node: User!
}

"""Paginated list of Users (Relay Connection)."""
type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  """Total users matching the filter, regardless of page window."""
  totalCount: Int!
}

extend type Query {
  """Admin-only. Paginated user list. Non-admin callers receive FORBIDDEN."""
  users(first: Int, after: ID, last: Int, before: ID, search: String): UserConnection!
  """Admin-only. Single user with roles populated. Non-admin callers receive FORBIDDEN."""
  adminUser(id: ID!): User
  """Admin-only. List all roles (used by admin role-assignment UI). Non-admin callers receive FORBIDDEN."""
  roles: [Role!]!
  """Admin-only. Single role by ID. Non-admin callers receive FORBIDDEN."""
  role(id: ID!): Role
}

"""Input for atomically editing admin-managed user fields and final roles."""
input AdminEditUserInput {
  """Current `User.version` observed by the client; stale values return `ConcurrentUpdateError`."""
  expectedVersion: Int!
  """null/omitted = unchanged. Non-null = set; must be 1-50 grapheme clusters after trim. Empty string is rejected with BAD_USER_INPUT."""
  displayName: String
  """null/omitted = unchanged. Empty string clears the field. Non-empty must be <= 500 grapheme clusters."""
  bio: String
  """Declarative final role set. Empty list removes all roles unless self-demotion guard blocks it."""
  roleIds: [ID!]!
}

extend type Mutation {
  """Admin-only. Atomically edit display_name / bio and replace the user's role set."""
  adminEditUser(id: ID!, input: AdminEditUserInput!): AdminEditUserResult!
  """Admin-only. Create a new role. Names are normalized to lowercase. Duplicates are returned as InputValidationError."""
  createRole(name: String!): CreateRoleResult!
  """
  Rename a role. System roles are immutable — the call returns
  CannotModifySystemRoleError as a typed union variant in that case.
  Validation failures (empty name, duplicate name) continue to surface
  as a top-level GraphQL error with extensions.code = "BAD_USER_INPUT".
  """
  updateRole(id: ID!, name: String!): UpdateRoleResult!
  """Admin-only. Delete a role. The system role "admin" cannot be deleted (FORBIDDEN). Returns true on success."""
  deleteRole(id: ID!): Boolean!
}
