"""Per-user FSRS scheduling state for a single card."""
type UserCardState {
  due: Time!
  state: Int!
}

"""
Common European Framework of Reference level (A1 easiest .. C2 hardest).
A1..C1 derive from the Oxford 3000/5000 word lists; C2 is sourced from the
Cambridge English Vocabulary Profile (advanced words not present in the Oxford
lists).
"""
enum CEFRLevel {
  A1
  A2
  B1
  B2
  C1
  C2
}

"""A flashcard with viewer-specific FSRS scheduling state."""
type Card {
  id: ID!
  front: String!
  back: String!
  """Foreign key to the owning cardgroup. The `cardgroup` prefix names the related type, not a stutter of the parent type."""
  # eslint-disable-next-line @graphql-eslint/no-typename-prefix
  cardgroupId: ID!
  """The parent cardgroup. Resolved via the per-request Cardgroup DataLoader."""
  # eslint-disable-next-line @graphql-eslint/no-typename-prefix
  cardgroup: Cardgroup!
  """
  Viewer's per-user FSRS state. For cards the viewer has not reviewed,
  resolves to a synthesized new-card state.
  """
  userCardState: UserCardState!
  """
  CEFR difficulty of `front`. A1..C1 are derived from the Oxford 3000/5000
  word lists; C2 is sourced from the Cambridge English Vocabulary Profile.
  `null` when no listed word matches. When several words match, the hardest
  level is reported.
  """
  cefrLevel: CEFRLevel
  createdAt: Time!
}

"""Input for creating a new card."""
input NewCardInput {
  cardgroupId: ID!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  front: String!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  back: String!
}

"""Input for `updateCard`. Fields default to "leave unchanged" when null or omitted."""
input UpdateCardInput {
  """null or omitted = leave unchanged."""
  front: String
  """null or omitted = leave unchanged."""
  back: String
}

"""Typed business error returned by `createCard` when an existing card in the same cardgroup already has the same front."""
type CardDuplicateFrontError implements UserError {
  message: String!
  existingCardId: ID!
  existingBack: String!
}

"""Success result of `createCard`. Returned as the union variant when the card was created."""
type CreateCardSuccess {
  card: Card!
}

"""Result of `createCard`. Either the created card, or a typed duplicate-front error returned as data."""
union CreateCardResult = CreateCardSuccess | CardDuplicateFrontError

"""Success variant returned by `updateCard` when the card was updated. Carries the updated `card` so clients can refresh local state without a follow-up query."""
type UpdateCardSuccess {
  card: Card!
}

"""Result of `updateCard`. Either the updated card or an input-validation failure."""
union UpdateCardResult =
    UpdateCardSuccess
  | InputValidationError

"""One element in a CardConnection."""
type CardEdge {
  """
  Opaque, server-encoded cursor for this position. Pass it back verbatim as
  `after`; never construct, parse, or derive one from `node.id`.
  The encoding is a server implementation detail and is not part of the contract.
  """
  cursor: ID!
  node: Card!
}

"""Paginated list of Cards (Relay Connection)."""
type CardConnection {
  edges: [CardEdge!]!
  pageInfo: PageInfo!
  """
  Total cards in the cardgroup, regardless of page window.
  Backed by a separate COUNT(*); intended for cardgroups up to ~10k cards.
  """
  totalCount: Int!
}

extend type Query {
  """
  Next batch of cards for a learning session: never-seen cards, newest-added first,
  interleaved with review cards at the caller's own `User.newCardRatio` setting
  (see `updateNewCardRatio`), which defaults to 1/5 — one new card per five
  slots — until the caller changes it. Slots are filled by largest-remainder
  distribution, so the ratio holds on every prefix rather than only on whole
  cycles: any `limit` yields the nearest whole number of new cards to
  `limit * numerator / denominator`, but never more than 80% of `limit` while
  review cards remain, subject to how many of each kind are due.
  The review side is every card whose due time falls before the end of today's
  JST learn day, served highest FSRS retrievability first (the cards most likely
  to still be remembered come first). Cards already reviewed today (JST) or on
  the current UTC date are excluded from the review group.
  Returns an empty list when the cardgroup has no eligible cards.
  Limit defaults to 20 (clamped to 100). Returns UNAUTHENTICATED if the caller does not own
  the cardgroup; BAD_USER_INPUT if the cardgroup does not exist.
  A limit of zero, a negative limit, and an explicit null are all treated as omitted and fall back to the default.
  """
  learnNextDueCards(cardgroupId: ID!, limit: Int = 20): [Card!]!
  """
  Cards the caller reviewed recently enough that learnNextDueCards withholds them,
  for schedule-neutral practice: reviewed today (JST), or on the current UTC date.
  Read-only: practice swipes are never recorded and never touch FSRS state.
  Exact complement of learnNextDueCards's last-review rule:
  last_review >= the earlier of start-of-today (JST) and start-of-today (UTC).
  Order is randomized per fetch. Limit defaults to 100 (clamped to 100).
  Returns UNAUTHENTICATED if the caller does not own the cardgroup;
  BAD_USER_INPUT if the cardgroup does not exist.
  A limit of zero, a negative limit, and an explicit null are all treated as omitted and fall back to the default.
  """
  practiceTodaysCards(cardgroupId: ID!, limit: Int = 100): [Card!]!
  """
  Paginated cards in a cardgroup. Forward-only cursor pagination (first, after).
  Cursors are opaque, server-encoded values: pass an edge cursor back verbatim and never build
  one from a node id. Default page size is 20; max is 100.
  `first: 0` is a deliberate deviation from the Relay spec for callers that want only
  `totalCount`: no edges are fetched and `hasNextPage` / `hasPreviousPage` are both false
  even when more rows exist. A negative `first` is clamped to 0 and therefore
  behaves identically.
  Optional case-insensitive substring search on front OR back (ILIKE partial match).
  Nil or empty string skips the search filter.
  Cards are returned in insertion order (`id ASC`); the ordering is fixed.
  """
  cardsByCardgroupConnection(
    cardgroupId: ID!,
    first: Int,
    after: ID,
    search: String
  ): CardConnection!
}

extend type Mutation {
  """
  Create a card in a cardgroup owned by the authenticated caller.
  Returns a union: `CreateCardSuccess` for the happy path, or `CardDuplicateFrontError`
  when a card with the same front already exists in the cardgroup (typed "error as data").
  """
  createCard(input: NewCardInput!): CreateCardResult!
  """Update a card. Non-owners receive UNAUTHENTICATED."""
  updateCard(id: ID!, input: UpdateCardInput!): UpdateCardResult!
  """Delete a card. Non-owners receive UNAUTHENTICATED."""
  deleteCard(id: ID!): Boolean!
  """Bulk-delete cards owned by the authenticated caller. Returns the number of rows deleted. Foreign-owned IDs in the list are silently skipped (count reflects only successful deletes)."""
  deleteCards(ids: [ID!]!): Int!
}
