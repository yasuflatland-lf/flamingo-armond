"""A user-owned named collection of flashcards. Owns no Card aggregate; cards live in a sibling aggregate."""
type Cardgroup {
  id: ID!
  name: String!
  ownerId: ID!
  createdAt: Time!
  updatedAt: Time!
  """The owning user. Resolved via the per-request User DataLoader."""
  owner: User!
}

"""Input for `createCardgroup`."""
input NewCardgroupInput {
  """1-100 grapheme clusters (length measured after trimming surrounding whitespace)."""
  name: String!
}

"""Input for `updateCardgroup`. Fields default to "leave unchanged" when null or omitted."""
input UpdateCardgroupInput {
  """null or omitted = leave unchanged."""
  name: String
}

"""Success variant returned by `createCardgroup` when the cardgroup was created. Carries the new `cardgroup` so clients can insert it into local caches without a follow-up query."""
type CreateCardgroupSuccess {
  cardgroup: Cardgroup!
}

"""
Returned by `createCardgroup` when a non-admin caller already owns the maximum
number of cardgroups. Admins are exempt. `limit` is the cap; `current` is the
caller's existing count at rejection time so the client can localize the copy.
"""
type CardgroupLimitReachedError implements UserError {
  message: String!
  limit: Int!
  current: Int!
}

"""Result of `createCardgroup`. One of: the created cardgroup, an input-validation failure, or a limit-reached error when a non-admin caller's cardgroup cap is exceeded."""
union CreateCardgroupResult =
    CreateCardgroupSuccess
  | InputValidationError
  | CardgroupLimitReachedError

"""Success variant returned by `updateCardgroup` when the cardgroup was updated. Carries the updated `cardgroup` so clients can refresh local state without a follow-up query."""
type UpdateCardgroupSuccess {
  cardgroup: Cardgroup!
}

"""Result of `updateCardgroup`. Either the updated cardgroup or an input-validation failure."""
union UpdateCardgroupResult =
    UpdateCardgroupSuccess
  | InputValidationError

"""Field to order Cardgroups by in paginated queries."""
enum CardgroupOrderBy {
  ID
  CREATED_AT
  UPDATED_AT
  NAME
}

"""One cardgroup plus the cursor pointing at it."""
type CardgroupEdge {
  """
  Opaque, server-encoded cursor for resuming pagination at this edge. Pass it back
  verbatim as `after` / `before`; never construct, parse, or derive one from `node.id`.
  The encoding is a server implementation detail and is not part of the contract.
  """
  cursor: ID!
  node: Cardgroup!
}

"""A page of cardgroups returned from a paginated query."""
type CardgroupConnection {
  edges: [CardgroupEdge!]!
  pageInfo: PageInfo!
  """Total cardgroup count matching the filter (independent of paging)."""
  totalCount: Int!
}

extend type Query {
  """Single cardgroup by ID. Returns null for a non-owner or a missing id alike, so existence is not leaked."""
  cardgroup(id: ID!): Cardgroup
  """
  Paginated cardgroups owned by the authenticated caller. Forward pagination uses
  (first, after); backward uses (last, before). Cursors are opaque, server-encoded
  values: pass an edge cursor back verbatim and never build one from a node id.
  Default page size is 20; max is 100.
  `first: 0` is a deliberate deviation from the Relay spec for callers that want only
  `totalCount`: no edges are fetched and `hasNextPage` / `hasPreviousPage` are both false
  even when more rows exist. A negative `first` or `last` is clamped to 0 and therefore
  behaves identically.
  Optional case-insensitive substring search on name.
  """
  myCardgroupsConnection(
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: CardgroupOrderBy = UPDATED_AT,
    orderDirection: SortOrder = DESC
  ): CardgroupConnection!
}

extend type Mutation {
  """
  Create a cardgroup owned by the authenticated caller.
  Returns a union: `CreateCardgroupSuccess` on the happy path,
  `InputValidationError` when the name fails validation (typed "error as data"),
  or `CardgroupLimitReachedError` when a non-admin caller already owns the
  maximum number of cardgroups.
  """
  createCardgroup(input: NewCardgroupInput!): CreateCardgroupResult!
  """Update a cardgroup. Non-owners receive UNAUTHENTICATED."""
  updateCardgroup(id: ID!, input: UpdateCardgroupInput!): UpdateCardgroupResult!
  """Delete a cardgroup. Non-owners receive UNAUTHENTICATED."""
  deleteCardgroup(id: ID!): Boolean!
}
