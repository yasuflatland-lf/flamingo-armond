"""A single card in a master deck. Master cards carry no per-viewer FSRS state."""
type MasterCard {
  id: ID!
  """Foreign key to the owning master cardgroup. The `masterCardgroup` prefix names the related type, not a stutter of the parent type."""
  # eslint-disable-next-line @graphql-eslint/no-typename-prefix
  masterCardgroupId: ID!
  front: String!
  back: String!
  position: Int!
  createdAt: Time!
  updatedAt: Time!
}

"""Sort key for an `adminMasterCardsConnection` page."""
enum MasterCardOrderBy { ID  POSITION  CREATED_AT  UPDATED_AT }

"""A Relay edge pairing an opaque cursor with a `MasterCard` node."""
type MasterCardEdge { cursor: ID!  node: MasterCard! }

"""A Relay connection over the cards in a master deck."""
type MasterCardConnection { edges: [MasterCardEdge!]!  pageInfo: PageInfo!  totalCount: Int! }

extend type Query {
  """Admin-only single master cardgroup incl. DRAFT. Non-admin callers receive FORBIDDEN."""
  adminMaster(id: ID!): MasterCardgroup
  """
  Admin-only paginated cards in a master deck. Forward (first, after) / backward (last, before).
  Cursors are opaque, server-encoded values: pass an edge cursor back verbatim and never build
  one from a node id. Default page size 20; max 100. Optional case-insensitive
  substring search on front OR back.
  """
  adminMasterCardsConnection(
    masterCardgroupId: ID!, first: Int, after: ID, last: Int, before: ID,
    search: String, orderBy: MasterCardOrderBy = POSITION, orderDirection: SortOrder = ASC
  ): MasterCardConnection!
  """
  Public paginated cards in a PUBLISHED master deck, for any authenticated caller.
  Forward (first, after) / backward (last, before). Cursors are opaque, server-encoded
  values: pass an edge cursor back verbatim and never build one from a node id.
  Default page size 20; max 100. Optional case-insensitive substring search on
  front OR back. A DRAFT, card-less or unknown deck is rejected as BAD_USER_INPUT
  on `masterCardgroupId` (non-disclosure gate: draft existence and emptiness are
  never revealed). Anonymous callers receive UNAUTHENTICATED.
  """
  masterCardsConnection(
    masterCardgroupId: ID!, first: Int, after: ID, last: Int, before: ID,
    search: String, orderBy: MasterCardOrderBy = POSITION, orderDirection: SortOrder = ASC
  ): MasterCardConnection!
  """
  A single catalog-visible master deck by id, for any authenticated caller. Returns
  null for an unknown id, a DRAFT id, or a published deck holding zero cards
  (non-disclosure gate). Anonymous callers receive UNAUTHENTICATED. Mirrors
  `adminMaster(id)` but catalog-visible-only (published AND non-empty) and non-admin.
  """
  masterCardgroup(id: ID!): MasterCardgroup
}

"""Input for creating a new master card in a master deck (admin-only)."""
input NewMasterCardInput {
  """Foreign key to the owning master cardgroup."""
  masterCardgroupId: ID!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  front: String!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  back: String!
}

"""Input for `adminUpdateMasterCard`. Fields default to "leave unchanged" when null or omitted."""
input UpdateMasterCardInput {
  """null or omitted = leave unchanged."""
  front: String
  """null or omitted = leave unchanged."""
  back: String
}

"""Input for `adminImportMasterCards`. Reuses the base64 text payload format of `validateCardImport`."""
input ImportMasterCardsInput {
  """Target master cardgroup ID. Must reference an existing master deck."""
  masterCardgroupId: ID!
  """Base64-encoded payload (standard alphabet, with padding). Same format as validateCardImport."""
  payload: String!
}

"""Typed business error returned by `adminCreateMasterCard` when a master card in the same deck already has the same (case-insensitive) front."""
type MasterCardDuplicateFrontError implements UserError {
  message: String!
  existingCardId: ID!
  existingBack: String!
}

"""Success result of `adminCreateMasterCard`. Carries the created master card."""
type CreateMasterCardSuccess {
  masterCard: MasterCard!
}

"""Result of `adminCreateMasterCard`. Either the created master card, or a typed duplicate-front error returned as data."""
union CreateMasterCardResult = CreateMasterCardSuccess | MasterCardDuplicateFrontError

"""Success result of `adminUpdateMasterCard`. Carries the updated master card so clients can refresh local state without a follow-up query."""
type UpdateMasterCardSuccess {
  masterCard: MasterCard!
}

"""Result of `adminUpdateMasterCard`. Either the updated master card or an input-validation failure."""
union UpdateMasterCardResult =
    UpdateMasterCardSuccess
  | InputValidationError

extend type Mutation {
  """
  Create a master card in a master deck. Admin-only.
  Returns `CreateMasterCardSuccess`, or `MasterCardDuplicateFrontError` when a card with the
  same (case-insensitive) front already exists in the deck (typed "error as data").
  """
  adminCreateMasterCard(input: NewMasterCardInput!): CreateMasterCardResult!
  """
  Update a master card's front/back. Admin-only.
  Returns `InputValidationError` when a provided field is empty or oversized.
  A missing or unknown id is a BAD_USER_INPUT error.
  """
  adminUpdateMasterCard(id: ID!, input: UpdateMasterCardInput!): UpdateMasterCardResult!
  """Delete a master card by ID. Admin-only. Returns true on success. A missing id is a BAD_USER_INPUT error."""
  adminDeleteMasterCard(id: ID!): Boolean!
  """Bulk-delete master cards by ID. Admin-only. Returns the number of rows deleted."""
  adminDeleteMasterCards(ids: [ID!]!): Int!
  """
  Persist parsed cards into a master deck. Admin-only. Two payload caps apply, exactly as on
  `importCards`: decoded text larger than 1 MiB (1,048,576 bytes) and a payload parsing to
  more than 5,000 rows each return a top-level BAD_USER_INPUT on `payload` and import
  nothing. Conflict key is (master_cardgroup_id, front) and is
  case-insensitive (citext); conflicting rows have their `back` text and `position` updated,
  others are inserted. Per-line parse errors are returned in `ImportCardsPayload.errors`.
  """
  adminImportMasterCards(input: ImportMasterCardsInput!): ImportCardsPayload!
}
