"""Publication lifecycle state of a master cardgroup."""
enum MasterCardgroupStatus {
  DRAFT
  PUBLISHED
}

"""
A published master cardgroup in the public catalog. This is the read-only
projection end users see; the admin-managed `master_*` tables are never exposed
directly. `cardCount` is the number of master cards in the deck.
"""
type MasterCardgroup {
  id: ID!
  name: String!
  description: String
  language: String
  level: String
  category: String
  coverImageUrl: String
  source: String
  version: Int!
  status: MasterCardgroupStatus!
  isDefaultStarter: Boolean!
  sortOrder: Int!
  cardCount: Int!
  createdAt: Time!
  updatedAt: Time!
}

"""Field to order the master catalog by in paginated queries."""
enum MasterCatalogOrderBy {
  SORT_ORDER
  CREATED_AT
  NAME
}

"""One master cardgroup plus the cursor pointing at it."""
type MasterCatalogEdge {
  """Opaque cursor for resuming pagination at this edge. Currently the master cardgroup id."""
  cursor: ID!
  node: MasterCardgroup!
}

"""A page of master cardgroups returned from the catalog query."""
type MasterCatalogConnection {
  edges: [MasterCatalogEdge!]!
  pageInfo: PageInfo!
  """Total published master cardgroup count matching the filter (independent of paging)."""
  totalCount: Int!
}

extend type Query {
  """
  Paginated published master cardgroups (the public catalog) for authenticated
  callers. Only `status = PUBLISHED` decks are ever returned — draft decks never
  leak. Forward pagination uses (first, after); backward uses (last, before).
  Cursor is the master cardgroup UUID. Default page size is 20; max is 100.
  Optional case-insensitive substring search on name.
  """
  masterCatalog(
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: MasterCatalogOrderBy = SORT_ORDER,
    orderDirection: SortOrder = ASC
  ): MasterCatalogConnection!
}

extend type Query {
  """
  Admin-only. Paginated master cardgroups including DRAFT and PUBLISHED decks.
  Non-admin callers receive FORBIDDEN. Same pagination/search/order contract as
  `masterCatalog`, but not status-filtered. Default page size 20; max 100.
  """
  adminMasters(
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: MasterCatalogOrderBy = SORT_ORDER,
    orderDirection: SortOrder = ASC
  ): MasterCatalogConnection!
}

"""Input for `adminCreateMasterCardgroup`."""
input CreateMasterCardgroupInput {
  """1-100 grapheme clusters after trimming."""
  name: String!
  description: String
  language: String
  level: String
  category: String
  coverImageUrl: String
  source: String
  isDefaultStarter: Boolean
  sortOrder: Int
}

"""Input for `adminUpdateMasterCardgroup`. null/omitted = leave unchanged."""
input UpdateMasterCardgroupInput {
  name: String
  description: String
  language: String
  level: String
  category: String
  coverImageUrl: String
  source: String
  isDefaultStarter: Boolean
  sortOrder: Int
}

"""Success variant of `adminCreateMasterCardgroup`."""
type CreateMasterCardgroupSuccess {
  master: MasterCardgroup!
}

"""Result of `adminCreateMasterCardgroup`. The created master or an input-validation failure."""
union CreateMasterCardgroupResult = CreateMasterCardgroupSuccess | InputValidationError

"""Success variant of `adminUpdateMasterCardgroup`."""
type UpdateMasterCardgroupSuccess {
  master: MasterCardgroup!
}

"""Result of `adminUpdateMasterCardgroup`. The updated master or an input-validation failure."""
union UpdateMasterCardgroupResult = UpdateMasterCardgroupSuccess | InputValidationError

"""Success variant of `adminPublishMasterCardgroup`."""
type PublishMasterCardgroupSuccess {
  master: MasterCardgroup!
}

"""
Returned by `adminPublishMasterCardgroup` when the target deck has zero master
cards. An empty deck cannot be published; the admin must add cards first.
"""
type MasterCardgroupEmptyError implements UserError {
  message: String!
}

"""Result of `adminPublishMasterCardgroup`. The published master or a typed empty-deck error."""
union PublishMasterCardgroupResult = PublishMasterCardgroupSuccess | MasterCardgroupEmptyError

"""Success variant of `importMasterCardgroup`: the newly created user-owned cardgroup snapshot."""
type ImportMasterCardgroupSuccess {
  cardgroup: Cardgroup!
}

"""
Typed business error returned by `importMasterCardgroup` when the requested master
cardgroup does not exist OR is not published. Draft existence is never disclosed:
both cases collapse to this single error so a caller cannot probe for unpublished decks.
"""
type MasterNotFoundError implements UserError {
  message: String!
}

"""Result of `importMasterCardgroup`: the imported cardgroup, or a typed not-found error returned as data."""
union ImportMasterCardgroupResult = ImportMasterCardgroupSuccess | MasterNotFoundError

"""Payload of `seedDefaultStarterCardgroups`: the user cardgroups created by the seed (empty if none, or if the caller already owns a cardgroup)."""
type SeedDefaultStartersPayload {
  cardgroups: [Cardgroup!]!
}

extend type Mutation {
  """Admin-only. Create a DRAFT master cardgroup. Non-admin callers receive FORBIDDEN."""
  adminCreateMasterCardgroup(input: CreateMasterCardgroupInput!): CreateMasterCardgroupResult!
  """Admin-only. Patch master cardgroup attributes. Non-admin callers receive FORBIDDEN."""
  adminUpdateMasterCardgroup(id: ID!, input: UpdateMasterCardgroupInput!): UpdateMasterCardgroupResult!
  """Admin-only. Publish a master cardgroup (bumps version). Empty decks return MasterCardgroupEmptyError."""
  adminPublishMasterCardgroup(id: ID!): PublishMasterCardgroupResult!
  """Admin-only. Revert a master cardgroup to DRAFT. Non-admin callers receive FORBIDDEN."""
  adminUnpublishMasterCardgroup(id: ID!): MasterCardgroup!
  """Admin-only. Permanently delete a master cardgroup. Returns true on success."""
  adminDeleteMasterCardgroup(id: ID!): Boolean!
  """
  Copy a published master cardgroup into the authenticated caller's own cardgroups
  as a one-time snapshot (no live link; FSRS/swipe state starts empty). An unknown id
  or a draft master returns `MasterNotFoundError` — draft existence is never leaked.
  Unauthenticated callers receive UNAUTHENTICATED.
  """
  importMasterCardgroup(masterCardgroupId: ID!): ImportMasterCardgroupResult!
  """
  Copy the published default-starter master decks into the authenticated caller's
  own cardgroups as one-time snapshots. Idempotent: a no-op if the caller already
  owns a cardgroup. Backs the onboarding "start with the default decks" path.
  Unauthenticated callers receive UNAUTHENTICATED.
  """
  seedDefaultStarterCardgroups: SeedDefaultStartersPayload!
}
