"""Publication lifecycle state of a master cardgroup."""
enum MasterCardgroupStatus {
  DRAFT
  PUBLISHED
}

"""
A published master cardgroup in the public catalog. This is the read-only
projection end users see; the admin-managed `master_*` tables are never exposed
directly. `cardCount` is the number of master cards in the deck.
"""
type MasterCardgroup {
  id: ID!
  name: String!
  description: String
  version: Int!
  status: MasterCardgroupStatus!
  isDefaultStarter: Boolean!
  sortOrder: Int!
  cardCount: Int!
  createdAt: Time!
  updatedAt: Time!
}

"""Field to order the master catalog by in paginated queries."""
enum MasterCatalogOrderBy {
  SORT_ORDER
  CREATED_AT
  NAME
}

"""One master cardgroup plus the cursor pointing at it."""
type MasterCatalogEdge {
  """
  Opaque, server-encoded cursor for resuming pagination at this edge. Pass it back
  verbatim as `after` / `before`; never construct, parse, or derive one from `node.id`.
  The encoding is a server implementation detail and is not part of the contract.
  """
  cursor: ID!
  node: MasterCardgroup!
}

"""A page of master cardgroups returned from the catalog query."""
type MasterCatalogConnection {
  edges: [MasterCatalogEdge!]!
  pageInfo: PageInfo!
  """
  Total master cardgroup count matching the active query's scope and filter,
  independent of paging. The scope is the querying field's, not this type's:
  `masterCatalog` counts only catalog-visible (published AND non-empty) decks,
  while `adminMasters` counts every deck regardless of status or card count.
  """
  totalCount: Int!
}

extend type Query {
  """
  Paginated published master cardgroups (the public catalog) for authenticated
  callers. Only `status = PUBLISHED` decks holding at least one master card are
  ever returned — draft and emptied decks never leak. A deck that loses its last
  card drops out of the catalog and reappears when a card is restored.
  Forward pagination uses (first, after); backward uses (last, before).
  Cursors are opaque, server-encoded values: pass an edge cursor back verbatim and
  never build one from a node id. Default page size is 20; max is 100.
  `first: 0` is a deliberate deviation from the Relay spec for callers that want only
  `totalCount`: no edges are fetched and `hasNextPage` / `hasPreviousPage` are both false
  even when more rows exist. A negative `first` or `last` is clamped to 0 and therefore
  behaves identically.
  Optional case-insensitive substring search on name.
  """
  masterCatalog(
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: MasterCatalogOrderBy = SORT_ORDER,
    orderDirection: SortOrder = ASC
  ): MasterCatalogConnection!
}

extend type Query {
  """
  Admin-only. Paginated master cardgroups including DRAFT and PUBLISHED decks.
  Non-admin callers receive FORBIDDEN. Same pagination/search/order contract as
  `masterCatalog`, but not status-filtered. Default page size 20; max 100.
  """
  adminMasters(
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: MasterCatalogOrderBy = SORT_ORDER,
    orderDirection: SortOrder = ASC
  ): MasterCatalogConnection!
}

"""Input for `adminCreateMasterCardgroup`."""
input CreateMasterCardgroupInput {
  """1-100 grapheme clusters after trimming."""
  name: String!
  description: String
  isDefaultStarter: Boolean
  sortOrder: Int
}

"""Input for `adminUpdateMasterCardgroup`. null/omitted = leave unchanged."""
input UpdateMasterCardgroupInput {
  name: String
  description: String
  isDefaultStarter: Boolean
  sortOrder: Int
}

"""Success variant of `adminCreateMasterCardgroup`."""
type CreateMasterCardgroupSuccess {
  master: MasterCardgroup!
}

"""Result of `adminCreateMasterCardgroup`. The created master or an input-validation failure."""
union CreateMasterCardgroupResult = CreateMasterCardgroupSuccess | InputValidationError

"""Success variant of `adminUpdateMasterCardgroup`."""
type UpdateMasterCardgroupSuccess {
  master: MasterCardgroup!
}

"""Result of `adminUpdateMasterCardgroup`. The updated master or an input-validation failure."""
union UpdateMasterCardgroupResult = UpdateMasterCardgroupSuccess | InputValidationError

"""Success variant of `adminPublishMasterCardgroup`."""
type PublishMasterCardgroupSuccess {
  master: MasterCardgroup!
}

"""
Returned by `adminPublishMasterCardgroup` when the target deck has zero master
cards. An empty deck cannot be published; the admin must add cards first.
"""
type MasterCardgroupEmptyError implements UserError {
  message: String!
}

"""Result of `adminPublishMasterCardgroup`. The published master or a typed empty-deck error."""
union PublishMasterCardgroupResult = PublishMasterCardgroupSuccess | MasterCardgroupEmptyError

"""Success variant of `importMasterCardgroup`: the newly created user-owned cardgroup snapshot."""
type ImportMasterCardgroupSuccess {
  cardgroup: Cardgroup!
}

"""
Typed business error returned by `importMasterCardgroup` when the requested master
cardgroup does not exist, is not published, OR is published with zero cards. Draft
existence and emptiness are never disclosed: all three cases collapse to this single
error so a caller cannot probe for unpublished or emptied decks.
"""
type MasterNotFoundError implements UserError {
  message: String!
}

"""
Result of `importMasterCardgroup`: the imported cardgroup, a typed not-found error,
or a limit-reached error when a non-admin caller has already reached the per-user
cardgroup cap. All three are returned as data. `CardgroupLimitReachedError` is the
same variant `createCardgroup` returns, so both entry points into "the caller now
owns a new deck" enforce the quota identically.
"""
union ImportMasterCardgroupResult =
    ImportMasterCardgroupSuccess
  | MasterNotFoundError
  | CardgroupLimitReachedError

"""Input for `mergeMasterCardgroup`: the published catalog deck to copy from and the caller-owned destination cardgroup to merge into."""
input MergeMasterCardgroupInput {
  """The published catalog deck (MasterCardgroup node id) to merge from."""
  masterCardgroupId: ID!
  """The caller-owned destination cardgroup to merge the cards into."""
  cardgroupId: ID!
}

"""
Success variant of `mergeMasterCardgroup`. `addedCount` is the number of cards
newly inserted; `updatedCount` is the number of existing cards (same front)
overwritten. Card ids are preserved on overwrite so FSRS state survives.
"""
type MergeMasterCardgroupSuccess {
  cardgroup: Cardgroup!
  addedCount: Int!
  updatedCount: Int!
}

"""Result of `mergeMasterCardgroup`: the merge tally, or a typed not-found error returned as data."""
union MergeMasterCardgroupResult = MergeMasterCardgroupSuccess | MasterNotFoundError

"""
Projected tally of `mergeMasterCardgroup` computed WITHOUT writing. `addedCount`
is the number of catalog cards whose front is not present in the destination;
`updatedCount` is the number whose front already exists (case-sensitively, matching
the destination `cards (cardgroup_id, front)` text unique index the merge upserts
against). The preview equals the tally `mergeMasterCardgroup` produces for the same
inputs over an unchanged destination and master deck: the preview reads outside a
transaction while the merge upserts inside one, so a concurrent edit to either deck
between the two calls can move a card from `addedCount` to `updatedCount`. The
catalog side is case-INsensitive (`master_cards.front` is `citext`); that asymmetry
is deliberate — see
`docs/backend/ddd-patterns/catalog-user-deck-front-case-asymmetry.md`.
"""
type MergeMasterCardgroupPreview {
  addedCount: Int!
  updatedCount: Int!
}

"""Result of `mergeMasterCardgroupPreview`: the projected tally, or a typed not-found error returned as data."""
union MergeMasterCardgroupPreviewResult = MergeMasterCardgroupPreview | MasterNotFoundError

extend type Query {
  """
  Dry-run preview of `mergeMasterCardgroup`: how many cards would be added vs.
  updated if the caller merged the published catalog deck into their own cardgroup,
  using the same (cardgroup_id, front) conflict key as the merge. Same auth/error
  contract as the mutation: unknown/draft/card-less master -> MasterNotFoundError; destination
  not found -> BAD_USER_INPUT; not owned -> UNAUTHENTICATED; unauthenticated callers
  receive UNAUTHENTICATED.
  """
  mergeMasterCardgroupPreview(input: MergeMasterCardgroupInput!): MergeMasterCardgroupPreviewResult!
}

"""Payload of `seedDefaultStarterCardgroups`: the user cardgroups created by the seed (empty if none, or if the caller already owns a cardgroup)."""
type SeedDefaultStartersPayload {
  cardgroups: [Cardgroup!]!
}

extend type Mutation {
  """Admin-only. Create a DRAFT master cardgroup. Non-admin callers receive FORBIDDEN."""
  adminCreateMasterCardgroup(input: CreateMasterCardgroupInput!): CreateMasterCardgroupResult!
  """Admin-only. Patch master cardgroup attributes. Non-admin callers receive FORBIDDEN."""
  adminUpdateMasterCardgroup(id: ID!, input: UpdateMasterCardgroupInput!): UpdateMasterCardgroupResult!
  """Admin-only. Publish a master cardgroup (bumps version). Empty decks return MasterCardgroupEmptyError."""
  adminPublishMasterCardgroup(id: ID!): PublishMasterCardgroupResult!
  """Admin-only. Revert a master cardgroup to DRAFT. Non-admin callers receive FORBIDDEN."""
  adminUnpublishMasterCardgroup(id: ID!): MasterCardgroup!
  """Admin-only. Permanently delete a master cardgroup. Returns true on success."""
  adminDeleteMasterCardgroup(id: ID!): Boolean!
  """
  Copy a published master cardgroup into the authenticated caller's own cardgroups
  as a one-time snapshot (no live link; FSRS/swipe state starts empty). An unknown,
  draft, or card-less master returns `MasterNotFoundError` — draft existence and
  emptiness are never leaked. Unauthenticated callers receive UNAUTHENTICATED.
  """
  importMasterCardgroup(masterCardgroupId: ID!): ImportMasterCardgroupResult!
  """
  Copy the published default-starter master decks into the authenticated caller's
  own cardgroups as one-time snapshots. Idempotent: a no-op if the caller already
  owns a cardgroup. Backs the onboarding "start with the default decks" path.
  Unauthenticated callers receive UNAUTHENTICATED.
  """
  seedDefaultStarterCardgroups: SeedDefaultStartersPayload!
  """
  Merge a published catalog deck's cards into the caller's existing cardgroup as a
  one-time snapshot. Cards whose front already exists in the destination are
  overwritten (back/position); card ids are preserved so FSRS state survives.
  An unknown, draft, or card-less master returns MasterNotFoundError (draft existence
  and emptiness are never leaked). A destination cardgroup not found is
  BAD_USER_INPUT; not owned is UNAUTHENTICATED. Unauthenticated callers receive
  UNAUTHENTICATED.
  """
  mergeMasterCardgroup(input: MergeMasterCardgroupInput!): MergeMasterCardgroupResult!
}
