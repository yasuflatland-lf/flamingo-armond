"""The per-user new-vs-review interleave ratio for a learn session, as a reduced
fraction: numerator new cards per (denominator) total, so the review share is
denominator - numerator. Defaults to 4/5 (80% new) when never set."""
type NewCardRatio {
  numerator: Int!
  denominator: Int!
}

extend type User {
  """
  The authenticated user's new-card ratio. Defaults to 4/5 when never set.
  """
  newCardRatio: NewCardRatio! @goField(forceResolver: true)
}

extend type Mutation {
  """
  Sets the authenticated caller's new-card ratio. numerator/denominator are
  reduced and validated server-side (1 <= numerator < denominator <= 100 after
  reduction); an out-of-range ratio returns extensions.code = "BAD_USER_INPUT".
  Unauthenticated callers receive extensions.code = "UNAUTHENTICATED". Returns
  the updated user. Idempotent.
  """
  updateNewCardRatio(numerator: Int!, denominator: Int!): User!
}
