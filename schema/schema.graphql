# Source of truth for both backend (gqlgen) and frontend (graphql-codegen).
# See docs/frontend.md for the codegen contract.

type Query {
  """Liveness probe for the GraphQL endpoint. Returns "ok"."""
  health: String!
}

"""Authenticated user's profile. 1:1 with auth.users."""
type User {
  """Matches auth.users.id (UUID v4)."""
  id: ID!
  displayName: String
  bio: String
  avatarUrl: String
}

extend type Query {
  """
  Returns the authenticated user's own profile.
  Unauthenticated callers receive an error with `extensions.code = "UNAUTHENTICATED"` and data is null.
  """
  me: User
}

input UpdateProfileInput {
  """1-50 characters (length measured after trimming surrounding whitespace)."""
  displayName: String!
  """null or omitted = leave unchanged; empty string = explicit clear."""
  bio: String
}

type UpdateProfilePayload {
  user: User!
}

type Mutation {
  """
  Updates the authenticated user's own profile.
  Unauthenticated callers receive an error with `extensions.code = "UNAUTHENTICATED"`.
  """
  updateProfile(input: UpdateProfileInput!): UpdateProfilePayload!
}

"""ISO-8601 / RFC-3339 timestamp serialized as a string."""
scalar Time

"""A user-owned named collection of flashcards. Owns no Card aggregate; cards live in a sibling aggregate."""
type Cardgroup {
  id: ID!
  name: String!
  ownerId: ID!
  createdAt: Time!
  updatedAt: Time!
  """The owning user. Resolved via the per-request User DataLoader."""
  owner: User!
}

input NewCardgroupInput {
  """1-100 grapheme clusters (length measured after trimming surrounding whitespace)."""
  name: String!
}

input UpdateCardgroupInput {
  """null or omitted = leave unchanged."""
  name: String
}

type CreateCardgroupPayload {
  cardgroup: Cardgroup!
}

type UpdateCardgroupPayload {
  cardgroup: Cardgroup!
}

extend type Query {
  """All cardgroups owned by the authenticated caller. Ordered by updated_at desc."""
  myCardgroups: [Cardgroup!]!
  """Single cardgroup by ID. Returns UNAUTHENTICATED for non-owners (existence is not leaked)."""
  cardgroup(id: ID!): Cardgroup
}

extend type Mutation {
  """Create a cardgroup owned by the authenticated caller."""
  createCardgroup(input: NewCardgroupInput!): CreateCardgroupPayload!
  """Update a cardgroup. Non-owners receive UNAUTHENTICATED."""
  updateCardgroup(id: ID!, input: UpdateCardgroupInput!): UpdateCardgroupPayload!
  """Delete a cardgroup. Non-owners receive UNAUTHENTICATED."""
  deleteCardgroup(id: ID!): Boolean!
}

"""A flashcard with read-only FSRS scheduling state."""
type Card {
  id: ID!
  front: String!
  back: String!
  cardgroupId: ID!
  """The parent cardgroup. Resolved via the per-request Cardgroup DataLoader."""
  cardgroup: Cardgroup!
  due: Time!
  stability: Float!
  difficulty: Float!
  state: Int!
  reps: Int!
  lapses: Int!
  lastReview: Time!
  createdAt: Time!
  updatedAt: Time!
}

"""
Input for creating a new card.
Optional FSRS overrides — pass either all nine or none. Mixing null + non-null is rejected with BAD_USER_INPUT.
"""
input NewCardInput {
  cardgroupId: ID!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  front: String!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  back: String!
  """Optional FSRS override: scheduled due timestamp."""
  due: Time
  """Optional FSRS override: memory stability value."""
  stability: Float
  """Optional FSRS override: item difficulty value."""
  difficulty: Float
  """Optional FSRS override: days elapsed since last review."""
  elapsedDays: Int
  """Optional FSRS override: days scheduled until next review."""
  scheduledDays: Int
  """Optional FSRS override: total number of reviews."""
  reps: Int
  """Optional FSRS override: total number of lapses."""
  lapses: Int
  """Optional FSRS override: card state (0=New, 1=Learning, 2=Review, 3=Relearning)."""
  state: Int
  """Optional FSRS override: timestamp of the last review."""
  lastReview: Time
}

input UpdateCardInput {
  """null or omitted = leave unchanged."""
  front: String
  """null or omitted = leave unchanged."""
  back: String
}

type CreateCardPayload {
  card: Card!
}

type UpdateCardPayload {
  card: Card!
}

"""Sort order for paginated queries."""
enum SortOrder {
  ASC
  DESC
}

"""Field to order Cards by in paginated queries."""
enum CardOrderBy {
  ID
  CREATED_AT
  UPDATED_AT
  DUE
}

"""Relay PageInfo describing whether more pages exist on either side and the boundary cursors."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: ID
  endCursor: ID
}

"""One element in a CardConnection."""
type CardEdge {
  """Opaque cursor for this position. Currently equal to node.id."""
  cursor: ID!
  node: Card!
}

"""Paginated list of Cards (Relay Connection)."""
type CardConnection {
  edges: [CardEdge!]!
  pageInfo: PageInfo!
  """
  Total cards in the cardgroup, regardless of page window.
  Backed by a separate COUNT(*); intended for cardgroups up to ~10k cards.
  """
  totalCount: Int!
}

extend type Query {
  """Single card by ID. Returns UNAUTHENTICATED for non-owners (existence is not leaked)."""
  card(id: ID!): Card
  """All cards in a cardgroup owned by the authenticated caller."""
  cardsByCardgroup(cardgroupId: ID!): [Card!]! @deprecated(reason: "Use cardsByCardgroupConnection")
  """
  Paginated cards in a cardgroup. Forward pagination uses (first, after); backward uses (last, before).
  Cursor is the card UUID. Default page size is 20; max is 100.
  """
  cardsByCardgroupConnection(
    cardgroupId: ID!,
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    orderBy: CardOrderBy = ID,
    orderDirection: SortOrder = ASC
  ): CardConnection!
}

extend type Mutation {
  """Create a card in a cardgroup owned by the authenticated caller."""
  createCard(input: NewCardInput!): CreateCardPayload!
  """Update a card. Non-owners receive UNAUTHENTICATED."""
  updateCard(id: ID!, input: UpdateCardInput!): UpdateCardPayload!
  """Delete a card. Non-owners receive UNAUTHENTICATED."""
  deleteCard(id: ID!): Boolean!
  """Bulk-delete cards owned by the authenticated caller. Returns the number of rows deleted. Foreign-owned IDs in the list are silently skipped (count reflects only successful deletes)."""
  deleteCards(ids: [ID!]!): Int!
}

input HandleSwipeInput {
  cardId: ID!
  cardgroupId: ID!
  """1=Again, 2=Hard, 4=Easy. The 3-step UI does not emit 3=Good."""
  mode: Int!
}

type SwipeResponse {
  """Next due cards, ordered by due ASC."""
  nextCards: [Card!]!
  """Reserved for the legacy adaptive UX. Always 0 until UserPerformanceService is ported."""
  performanceMode: Int!
}

extend type Mutation {
  """Apply one swipe rating, persist the SwipeRecord event, and return the next due cards."""
  handleSwipe(input: HandleSwipeInput!): SwipeResponse!
}
