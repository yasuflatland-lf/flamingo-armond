# Source of truth for both backend (gqlgen) and frontend (graphql-codegen).
# See docs/frontend.md for the codegen contract.

type Query {
  """Liveness probe for the GraphQL endpoint. Returns "ok"."""
  health: String!
}

"""Authenticated user's profile. 1:1 with auth.users."""
type User {
  """Matches auth.users.id (UUID v4)."""
  id: ID!
  displayName: String
  bio: String
  avatarUrl: String
}

extend type Query {
  """
  Returns the authenticated user's own profile.
  Unauthenticated callers receive an error with `extensions.code = "UNAUTHENTICATED"` and data is null.
  """
  me: User
}

input UpdateProfileInput {
  """1-50 characters (length measured after trimming surrounding whitespace)."""
  displayName: String!
  """null or omitted = leave unchanged; empty string = explicit clear."""
  bio: String
}

type UpdateProfilePayload {
  user: User!
}

type Mutation {
  """
  Updates the authenticated user's own profile.
  Unauthenticated callers receive an error with `extensions.code = "UNAUTHENTICATED"`.
  """
  updateProfile(input: UpdateProfileInput!): UpdateProfilePayload!
}
