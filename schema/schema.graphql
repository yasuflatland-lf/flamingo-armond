# Source of truth for both backend (gqlgen) and frontend (graphql-codegen).
# See docs/frontend/codegen.md for the codegen contract.

"""Root of all read operations exposed by the GraphQL API. See per-field doc-blocks for individual queries."""
type Query {
  """Liveness probe for the GraphQL endpoint. Returns "ok"."""
  health: String!
}

"""ISO-8601 / RFC-3339 timestamp serialized as a string."""
scalar Time

"""
Interface for typed business errors surfaced as `data` (Apollo "Errors as data"
pattern). Implementors expose a `message: String!` and may add typed fields.
"""
interface UserError {
  message: String!
}

"""
Generic input-validation failure used as the UserError variant in outcome-union
mutations. Mapped from `*ucerr.ValidationError` via `gqlerr.FromUsecaseError`.
Also surfaced via the `errors` array with `extensions.code = "BAD_USER_INPUT"`
and `extensions.field` for mutations that have not yet been promoted to a
result union.
"""
type InputValidationError implements UserError {
  """The input field that failed validation. Matches the GraphQL input field name (camelCase)."""
  field: String!
  """Human-readable, English error message."""
  message: String!
}

"""Sort order for paginated queries."""
enum SortOrder {
  ASC
  DESC
}

"""Relay PageInfo describing whether more pages exist on either side and the boundary cursors."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: ID
  endCursor: ID
}
