# Source of truth for both backend (gqlgen) and frontend (graphql-codegen).
# See docs/frontend.md for the codegen contract.

type Query {
  """Liveness probe for the GraphQL endpoint. Returns "ok"."""
  health: String!
}

"""Authenticated user's profile. 1:1 with auth.users."""
type User {
  """Matches auth.users.id (UUID v4)."""
  id: ID!
  displayName: String
  bio: String
  avatarUrl: String
}

extend type Query {
  """
  Returns the authenticated user's own profile.
  Unauthenticated callers receive an error with `extensions.code = "UNAUTHENTICATED"` and data is null.
  """
  me: User
}

input UpdateProfileInput {
  """1-50 characters (length measured after trimming surrounding whitespace)."""
  displayName: String!
  """null or omitted = leave unchanged; empty string = explicit clear."""
  bio: String
}

type UpdateProfilePayload {
  user: User!
}

type Mutation {
  """
  Updates the authenticated user's own profile.
  Unauthenticated callers receive an error with `extensions.code = "UNAUTHENTICATED"`.
  """
  updateProfile(input: UpdateProfileInput!): UpdateProfilePayload!
}

"""ISO-8601 / RFC-3339 timestamp serialized as a string."""
scalar Time

"""A user-owned named collection of flashcards. Owns no Card aggregate; cards live in a sibling aggregate."""
type Cardgroup {
  id: ID!
  name: String!
  ownerId: ID!
  createdAt: Time!
  updatedAt: Time!
  """The owning user. Resolved via the per-request User DataLoader."""
  owner: User!
}

input NewCardgroupInput {
  """1-100 grapheme clusters (length measured after trimming surrounding whitespace)."""
  name: String!
}

input UpdateCardgroupInput {
  """null or omitted = leave unchanged."""
  name: String
}

type CreateCardgroupPayload {
  cardgroup: Cardgroup!
}

type UpdateCardgroupPayload {
  cardgroup: Cardgroup!
}

extend type Query {
  """All cardgroups owned by the authenticated caller. Ordered by updated_at desc."""
  myCardgroups: [Cardgroup!]! @deprecated(reason: "Use myCardgroupsConnection")
  """Single cardgroup by ID. Returns UNAUTHENTICATED for non-owners (existence is not leaked)."""
  cardgroup(id: ID!): Cardgroup
  """
  Paginated cardgroups owned by the authenticated caller. Forward pagination uses
  (first, after); backward uses (last, before). Cursor is the cardgroup UUID. Default
  page size is 20; max is 100. Optional case-insensitive substring search on name.
  """
  myCardgroupsConnection(
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: CardgroupOrderBy = UPDATED_AT,
    orderDirection: SortOrder = DESC
  ): CardgroupConnection!
}

extend type Mutation {
  """Create a cardgroup owned by the authenticated caller."""
  createCardgroup(input: NewCardgroupInput!): CreateCardgroupPayload!
  """Update a cardgroup. Non-owners receive UNAUTHENTICATED."""
  updateCardgroup(id: ID!, input: UpdateCardgroupInput!): UpdateCardgroupPayload!
  """Delete a cardgroup. Non-owners receive UNAUTHENTICATED."""
  deleteCardgroup(id: ID!): Boolean!
}

"""A flashcard with read-only FSRS scheduling state."""
type Card {
  id: ID!
  front: String!
  back: String!
  cardgroupId: ID!
  """The parent cardgroup. Resolved via the per-request Cardgroup DataLoader."""
  cardgroup: Cardgroup!
  due: Time!
  stability: Float!
  difficulty: Float!
  state: Int!
  reps: Int!
  lapses: Int!
  lastReview: Time!
  createdAt: Time!
  updatedAt: Time!
}

"""
Input for creating a new card.
Optional FSRS overrides — pass either all nine or none. Mixing null + non-null is rejected with BAD_USER_INPUT.
"""
input NewCardInput {
  cardgroupId: ID!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  front: String!
  """1-500 grapheme clusters (length measured after trimming surrounding whitespace)."""
  back: String!
  """Optional FSRS override: scheduled due timestamp."""
  due: Time
  """Optional FSRS override: memory stability value."""
  stability: Float
  """Optional FSRS override: item difficulty value."""
  difficulty: Float
  """Optional FSRS override: days elapsed since last review."""
  elapsedDays: Int
  """Optional FSRS override: days scheduled until next review."""
  scheduledDays: Int
  """Optional FSRS override: total number of reviews."""
  reps: Int
  """Optional FSRS override: total number of lapses."""
  lapses: Int
  """Optional FSRS override: card state (0=New, 1=Learning, 2=Review, 3=Relearning)."""
  state: Int
  """Optional FSRS override: timestamp of the last review."""
  lastReview: Time
}

input UpdateCardInput {
  """null or omitted = leave unchanged."""
  front: String
  """null or omitted = leave unchanged."""
  back: String
}

"""Typed business error returned by `createCard` when an existing card in the same cardgroup already has the same front."""
type CardDuplicateFrontError implements UserError {
  message: String!
  existingCardId: ID!
  existingBack: String!
}

"""Success result of `createCard`. Returned as the union variant when the card was created."""
type CreateCardSuccess {
  card: Card!
}

"""Result of `createCard`. Either the created card, or a typed duplicate-front error returned as data."""
union CreateCardResult = CreateCardSuccess | CardDuplicateFrontError

type UpdateCardPayload {
  card: Card!
}

"""Sort order for paginated queries."""
enum SortOrder {
  ASC
  DESC
}

"""Field to order Cards by in paginated queries."""
enum CardOrderBy {
  ID
  CREATED_AT
  UPDATED_AT
  DUE
}

"""Field to order Cardgroups by in paginated queries."""
enum CardgroupOrderBy {
  ID
  CREATED_AT
  UPDATED_AT
  NAME
}

"""Relay PageInfo describing whether more pages exist on either side and the boundary cursors."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: ID
  endCursor: ID
}

"""One element in a CardConnection."""
type CardEdge {
  """Opaque cursor for this position. Currently equal to node.id."""
  cursor: ID!
  node: Card!
}

"""Paginated list of Cards (Relay Connection)."""
type CardConnection {
  edges: [CardEdge!]!
  pageInfo: PageInfo!
  """
  Total cards in the cardgroup, regardless of page window.
  Backed by a separate COUNT(*); intended for cardgroups up to ~10k cards.
  """
  totalCount: Int!
}

"""One cardgroup plus the cursor pointing at it."""
type CardgroupEdge {
  """Opaque cursor for resuming pagination at this edge. Currently the cardgroup id."""
  cursor: ID!
  node: Cardgroup!
}

"""A page of cardgroups returned from a paginated query."""
type CardgroupConnection {
  edges: [CardgroupEdge!]!
  pageInfo: PageInfo!
  """Total cardgroup count matching the filter (independent of paging)."""
  totalCount: Int!
}

extend type Query {
  """Single card by ID. Returns UNAUTHENTICATED for non-owners (existence is not leaked)."""
  card(id: ID!): Card
  """All cards in a cardgroup owned by the authenticated caller."""
  cardsByCardgroup(cardgroupId: ID!): [Card!]! @deprecated(reason: "Use cardsByCardgroupConnection")
  """
  Paginated cards in a cardgroup. Forward pagination uses (first, after); backward uses (last, before).
  Cursor is the card UUID. Default page size is 20; max is 100.
  Optional case-insensitive substring search on front OR back (ILIKE partial match).
  Nil or empty string skips the search filter.
  """
  cardsByCardgroupConnection(
    cardgroupId: ID!,
    first: Int,
    after: ID,
    last: Int,
    before: ID,
    search: String,
    orderBy: CardOrderBy = ID,
    orderDirection: SortOrder = ASC
  ): CardConnection!
}

extend type Mutation {
  """
  Create a card in a cardgroup owned by the authenticated caller.
  Returns a union: `CreateCardSuccess` for the happy path, or `CardDuplicateFrontError`
  when a card with the same front already exists in the cardgroup (typed "error as data").
  """
  createCard(input: NewCardInput!): CreateCardResult!
  """Update a card. Non-owners receive UNAUTHENTICATED."""
  updateCard(id: ID!, input: UpdateCardInput!): UpdateCardPayload!
  """Delete a card. Non-owners receive UNAUTHENTICATED."""
  deleteCard(id: ID!): Boolean!
  """Bulk-delete cards owned by the authenticated caller. Returns the number of rows deleted. Foreign-owned IDs in the list are silently skipped (count reflects only successful deletes)."""
  deleteCards(ids: [ID!]!): Int!
}

input HandleSwipeInput {
  cardId: ID!
  cardgroupId: ID!
  """1=Again, 2=Hard, 4=Easy. The 3-step UI does not emit 3=Good."""
  mode: Int!
}

type SwipeResponse {
  """Next due cards, ordered by due ASC."""
  nextCards: [Card!]!
  """Performance mode for the swipe flow, expressed as an Int in the 0..4 range."""
  performanceMode: Int!
  metrics: PerformanceMetrics!
}

type PerformanceMetrics {
  successRate: Float!
  avgDifficulty: Float!
  retentionRate: Float!
  studyStreak: Int!
  lapseRate: Float!
  reviewCount: Int!
}

extend type Mutation {
  """Apply one swipe rating, persist the SwipeRecord event, and return the next due cards."""
  handleSwipe(input: HandleSwipeInput!): SwipeResponse!
}

"""
Interface for typed business errors surfaced as `data` (Apollo "Errors as data"
pattern). Implementors expose a `message: String!` and may add typed fields.
"""
interface UserError {
  message: String!
}

"""Base64-encoded dictionary text payload submitted for validation."""
input ValidateDictionaryInput {
  """Base64-encoded text payload (standard alphabet, with padding). One front/back pair per line."""
  payload: String!
}

"""Single parsed dictionary entry."""
type ParsedWord {
  """Front (term) text."""
  front: String!
  """Back (definition) text."""
  back: String!
  """1-based line number in the decoded payload where this entry was parsed."""
  line: Int!
}

"""Classifier for a DictionaryValidationError. Closed enumeration; branch on this rather than substring-matching `message`."""
enum DictionaryValidationKind {
  """Programming-error sentinel. Never returned by a healthy server. If a client observes this, file a bug — the server should be panicking or asserting before this value escapes."""
  UNKNOWN
  """Hard error: payload-level (oversized / empty) or grammar/lexer error not recovered by skip productions."""
  HARD
  """Skipped: a lone WORD line with no DEFINITION attached. The dropped front term is in `snippet`."""
  FRONT_ONLY
  """Skipped: a lone DEFINITION line with no preceding front. The dropped back text is in `snippet`."""
  BACK_ONLY
  """Skipped: an unrecognized character was encountered. The recovered line content is in `snippet`."""
  UNRECOGNIZED
  """Post-parse dedupe: a duplicate row was dropped. The dropped row's `front` and `back` are populated."""
  DUPLICATE
}

type DictionaryValidationError implements UserError {
  """1-based line number where the error was detected, or 0 when the error applies to the payload as a whole (e.g. oversized or empty payload)."""
  line: Int!
  """Human-readable, English error message."""
  message: String!
  """Closed classifier for the parse event."""
  kind: DictionaryValidationKind!
  """Parser-extracted snippet. Populated for FRONT_ONLY (the WORD token text), BACK_ONLY (the DEFINITION token text), and UNRECOGNIZED (the recovered malformed line). Null for HARD and DUPLICATE."""
  snippet: String
  """Dedupe-duplicate only: the front term of the dropped row. Null for every other kind."""
  front: String
  """Dedupe-duplicate only: the back text of the dropped row. Null for every other kind."""
  back: String
}

"""
Result of validating a dictionary payload. The resolver enforces the
invariant valid = (len(errors) == 0 && len(parsedWords) > 0); conflicting
states are representable but never emitted.
"""
type DictionaryValidationResult {
  """True iff the payload parsed without any errors and produced at least one word."""
  valid: Boolean!
  """Parsed words preserving source order."""
  parsedWords: [ParsedWord!]!
  """Structured per-line errors, empty when valid is true."""
  errors: [DictionaryValidationError!]!
}

extend type Query {
  """
  Validate a base64-encoded dictionary payload without persisting any cards.
  Admin role required; non-admin callers receive a FORBIDDEN error.
  """
  validateDictionary(input: ValidateDictionaryInput!): DictionaryValidationResult!
}

"""
Input for upserting a parsed dictionary into a target cardgroup.
`UpsertDictionaryInput` reuses the same base64 + tab/space-separated front/back format as `validateDictionary`.
"""
input UpsertDictionaryInput {
  """Target cardgroup ID. Must reference an existing cardgroup (FK constraint at upsert time). FORBIDDEN response is enforced at the mutation level for non-admin callers."""
  cardgroupId: ID!
  """Base64-encoded payload (standard alphabet, with padding). Same format as validateDictionary."""
  payload: String!
}

"""
Result of an `upsertDictionary` call. `inserted + updated` is the number of rows that were processed successfully.
`errors` carries per-line parse failures; the upsert proceeds with the valid rows when errors are non-empty.
"""
type UpsertDictionaryPayload {
  """Number of cards newly inserted."""
  inserted: Int!
  """Number of cards updated (back text changed via ON CONFLICT)."""
  updated: Int!
  """Per-line parse errors. Empty when the entire payload parsed cleanly."""
  errors: [DictionaryValidationError!]!
}

extend type Mutation {
  """
  Persist a parsed dictionary payload into the target cardgroup. Admin-only;
  non-admin callers receive FORBIDDEN. Caps payload at 5,000 parsed rows;
  larger payloads return BAD_USER_INPUT. Conflict key is (cardgroup_id, front);
  conflicting rows have their `back` text updated, others are inserted.
  """
  upsertDictionary(input: UpsertDictionaryInput!): UpsertDictionaryPayload!
}

"""A named permission role. Names are stored lowercase (e.g., "admin", "general")."""
type Role {
  id: ID!
  name: String!
}

extend type User {
  """Roles assigned to this user. Resolved via the per-request RoleByUserID DataLoader."""
  roles: [Role!]!
  """
  The cardgroup this user most recently viewed on /learn.
  Used to land returning users directly on the learn screen.
  Null when never set, or when the referenced cardgroup was deleted (FK cascade SET NULL).
  """
  lastViewedCardgroup: Cardgroup
}

"""One element in a UserConnection."""
type UserEdge {
  """Opaque cursor for this position. Currently equal to node.id."""
  cursor: ID!
  node: User!
}

"""Paginated list of Users (Relay Connection)."""
type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  """Total users matching the filter, regardless of page window."""
  totalCount: Int!
}

extend type Query {
  """Admin-only. Paginated user list. Non-admin callers receive FORBIDDEN."""
  users(first: Int, after: ID, last: Int, before: ID, search: String): UserConnection!
  """Admin-only. Single user with roles populated. Non-admin callers receive FORBIDDEN."""
  adminUser(id: ID!): User
  """Admin-only. List all roles (used by admin role-assignment UI). Non-admin callers receive FORBIDDEN."""
  roles: [Role!]!
  """Admin-only. Single role by ID. Non-admin callers receive FORBIDDEN."""
  role(id: ID!): Role
}

"""Input for admin-edited user fields."""
input AdminUpdateUserInput {
  """null/omitted = unchanged. Non-null = set; must be 1-50 grapheme clusters after trim. Empty string is rejected with BAD_USER_INPUT."""
  displayName: String
  """null/omitted = unchanged. Empty string clears the field. Non-empty must be <= 500 grapheme clusters."""
  bio: String
}

extend type Mutation {
  """Admin-only. Edit display_name / bio of any user."""
  adminUpdateUser(id: ID!, input: AdminUpdateUserInput!): User!
  """Admin-only. Assign a role to a user. Idempotent."""
  assignRole(userId: ID!, roleId: ID!): User!
  """Admin-only. Revoke a role from a user. Self-demotion of admin role is rejected with FORBIDDEN."""
  revokeRole(userId: ID!, roleId: ID!): User!
  """Admin-only. Create a new role. Names are normalized to lowercase. Duplicates are rejected with BAD_USER_INPUT."""
  createRole(name: String!): Role!
  """Admin-only. Rename a role. The system role "admin" cannot be renamed (FORBIDDEN). Duplicates are rejected with BAD_USER_INPUT."""
  updateRole(id: ID!, name: String!): Role!
  """Admin-only. Delete a role. The system role "admin" cannot be deleted (FORBIDDEN). Returns true on success."""
  deleteRole(id: ID!): Boolean!
}

extend type Mutation {
  """
  Records the cardgroup the authenticated user most recently viewed on /learn.
  Idempotent. Returns the updated user.
  Errors:
   - UNAUTHENTICATED  — caller has no session
   - BAD_USER_INPUT   — cardgroupId does not exist or is not owned by caller
                        (existence of others' cardgroups is not leaked: same code in both cases)
  """
  setLastViewedCardgroup(cardgroupId: ID!): User!
}
