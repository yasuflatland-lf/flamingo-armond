"""A learner's aggregate learning statistics."""
type LearningStats {
  """Disjoint three-tier mastery counts across all studied cards."""
  mastery: MasteryBreakdown!
  """Per-deck acquisition, one entry per owned deck that has at least one card (decks with cards but no studied cards are included; empty decks are omitted)."""
  decks: [DeckMastery!]!
  """Diagnostic performance snapshots over trailing rolling windows."""
  performanceWindows: PerformanceWindows!
  """Cards the learner struggles with most, ranked by lapses (desc) then stability (asc), filtered to at least one lapse, capped at 10."""
  strugglingCards: [StrugglingCard!]!
  """True iff the caller owns at least one deck (cardgroup), regardless of card count. Distinguishes a brand-new user (owns nothing) from one who created a deck but has not added any cards yet — `decks` omits zero-card decks, so it alone cannot make that distinction."""
  ownsAnyDeck: Boolean!
}

"""Trailing rolling-window diagnostic snapshots. days30/days7 are computed from the swipes inside each window; studyStreak is always computed from the full 365-day set, so every window reports the same value. Because the source window is 365 days, the reported streak is capped at 365 days."""
type PerformanceWindows {
  """Snapshot over the trailing 365-day window."""
  days365: PerformanceMetrics!
  """Snapshot over the trailing 30-day window."""
  days30: PerformanceMetrics!
  """Snapshot over the trailing 7-day window."""
  days7: PerformanceMetrics!
}

"""A card the learner struggles with (high lapses / low stability)."""
type StrugglingCard {
  """The struggling card."""
  card: Card!
  """Number of times the card was rated Again on a repeat exposure (the FSRS lapse counter)."""
  lapses: Int!
  """The card's current FSRS memory stability, in days."""
  stability: Float!
}

"""Disjoint three-tier mastery counts across all studied cards. The three tiers sum to totalStudied."""
type MasteryBreakdown {
  """Studied cards whose memory stability is below the learned threshold (7 days) — still being acquired, or recently lapsed."""
  inProgress: Int!
  """Cards whose stability is between the learned threshold (7 days) and the maturity threshold (21 days)."""
  learned: Int!
  """Cards at or above the maturity stability threshold (21 days; durably retained)."""
  mature: Int!
  """Total number of studied cards; equals inProgress + learned + mature."""
  totalStudied: Int!
}

"""Per-deck acquisition. learnedCards/matureCards are disjoint; acquired = learnedCards + matureCards."""
type DeckMastery {
  """The owning deck."""
  cardgroup: Cardgroup!
  """Total cards in the deck (the acquisition denominator)."""
  totalCards: Int!
  """Studied cards in the deck that are Learned (disjoint from matureCards)."""
  learnedCards: Int!
  """Studied cards in the deck that are Mature (disjoint from learnedCards)."""
  matureCards: Int!
}

extend type Query {
  """The authenticated caller's learning statistics. Unauthenticated callers receive extensions.code = "UNAUTHENTICATED"."""
  myLearningStats: LearningStats!
}
