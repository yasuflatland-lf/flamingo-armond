"""Input for `handleSwipe`. Identifies the card under review and the rating the user emitted."""
input HandleSwipeInput {
  cardId: ID!
  cardgroupId: ID!
  """1=Again, 2=Hard, 4=Easy. The 3-step UI does not emit 3=Good."""
  rating: Int!
}

"""Success variant returned by `handleSwipe`: the swipe was recorded, or ignored as a repeat or not-due review. Carries no statistics — the client manages its own queue, and learning statistics are served by `myLearningStats`."""
type HandleSwipeSuccess {
  """The swiped card, echoed from the input."""
  cardId: ID!
}

"""Result of `handleSwipe`. Either the swipe acknowledgement or an input-validation failure."""
union HandleSwipeResult =
    HandleSwipeSuccess
  | InputValidationError

extend type Mutation {
  """Apply one swipe rating, persist the SwipeRecord event, and return the swiped card id. A rating the learn queue would not serve now is accepted and ignored: a repeat of a card already reviewed in the current JST learn day or on the current UTC date, or a rating for a card whose due is at or after the next JST midnight. The card's schedule is left untouched and no SwipeRecord is written, but the mutation still returns the normal success payload, so a replayed or stale request needs no special client handling."""
  handleSwipe(input: HandleSwipeInput!): HandleSwipeResult!
}
