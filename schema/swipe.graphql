"""Input for `handleSwipe`. Identifies the card under review and the rating the user emitted."""
input HandleSwipeInput {
  cardId: ID!
  cardgroupId: ID!
  """1=Again, 2=Hard, 4=Easy. The 3-step UI does not emit 3=Good."""
  rating: Int!
}

"""Performance mode inferred from the viewer's recent swipe performance, spanning DIFFICULT (weakest) to MASTERED (strongest)."""
enum SwipePerformanceMode {
  DIFFICULT
  DEFAULT
  GOOD
  EASY
  MASTERED
}

"""Response returned by `handleSwipe` — the latest performance snapshot for the swipe flow."""
type SwipeResponse {
  """Performance mode for the swipe flow, inferred from the viewer's recent performance."""
  performanceMode: SwipePerformanceMode!
  metrics: PerformanceMetrics!
}

"""Per-viewer performance metrics returned alongside a swipe response."""
type PerformanceMetrics {
  successRate: Float!
  avgDifficulty: Float!
  retentionRate: Float!
  studyStreak: Int!
  lapseRate: Float!
  reviewCount: Int!
}

"""Success variant returned by `handleSwipe` when the swipe was recorded. Carries the latest `SwipeResponse` (performance snapshot only — the client manages its own queue and prefetches the next page separately)."""
type HandleSwipeSuccess {
  response: SwipeResponse!
}

"""Result of `handleSwipe`. Either the swipe response or an input-validation failure."""
union HandleSwipeResult =
    HandleSwipeSuccess
  | InputValidationError

extend type Mutation {
  """Apply one swipe rating, persist the SwipeRecord event, and return the latest performance snapshot."""
  handleSwipe(input: HandleSwipeInput!): HandleSwipeResult!
}
